    // ─── LOADING & OFFLINE ──────────────────────────────
    let loaderInterval=null;
    function showLoading(msg="Cargando..."){
      const el=$("#loading");
      if(!el) return;
      const status=el.querySelector("#loaderStatus");
      const progress=el.querySelector("#loaderProgress");
      if(status) status.textContent=msg;
      el.classList.add("show");
      if(progress){
        let width=0;
        clearInterval(loaderInterval);
        loaderInterval=setInterval(()=>{
          width+=Math.random()*25+10;
          if(width>85) width=85;
          progress.style.width=width+"%";
        },150);
      }
    }
    function hideLoading(){
      const el=$("#loading");
      if(!el) return;
      const progress=el.querySelector("#loaderProgress");
      clearInterval(loaderInterval);
      if(progress){
        progress.style.width="100%";
        setTimeout(()=>{
          el.classList.remove("show");
          progress.style.width="0%";
        },200);
      } else {
        el.classList.remove("show");
      }
    }
    function checkOnline(){
      const banner=$("#offline");
      if(!navigator.onLine){banner?.classList.add("show")}
      else{banner?.classList.remove("show")}
    }
    window.addEventListener("online",checkOnline);
    window.addEventListener("offline",checkOnline);
    checkOnline();

    // ─── VISUAL EFFECTS ────────────────────────────────
    function initEffects(){
      // 3D Tilt on product cards
      document.querySelectorAll(".product").forEach(card=>{
        card.addEventListener("mousemove",e=>{
          const rect=card.getBoundingClientRect();
          const x=e.clientX-rect.left;
          const y=e.clientY-rect.top;
          const centerX=rect.width/2;
          const centerY=rect.height/2;
          const rotateX=(y-centerY)/20;
          const rotateY=(centerX-x)/20;
          card.style.transform=`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px)`;
        });
        card.addEventListener("mouseleave",()=>{
          card.style.transform="perspective(1000px) rotateX(0) rotateY(0) translateY(0)";
        });
      });

      // Ripple effect on buttons
      document.querySelectorAll(".primary,.ok-btn,.quick-btn").forEach(btn=>{
        btn.addEventListener("click",e=>{
          const ripple=document.createElement("span");
          ripple.style.cssText=`position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:ripple .6s linear;pointer-events:none`;
          const rect=btn.getBoundingClientRect();
          const size=Math.max(rect.width,rect.height);
          ripple.style.width=ripple.style.height=size+"px";
          ripple.style.left=(e.clientX-rect.left-size/2)+"px";
          ripple.style.top=(e.clientY-rect.top-size/2)+"px";
          btn.appendChild(ripple);
          setTimeout(()=>ripple.remove(),600);
        });
      });

      // Scroll reveal for cards
      const observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            entry.target.style.opacity="1";
            entry.target.style.transform="translateY(0)";
          }
        });
      },{threshold:0.1});
      document.querySelectorAll(".card,.list-row,.product").forEach(el=>{
        el.style.opacity="0";
        el.style.transform="translateY(20px)";
        el.style.transition="all .5s cubic-bezier(.2,.8,.2,1)";
        observer.observe(el);
      });
    }

    // Add ripple keyframe dynamically
    const style=document.createElement("style");
    style.textContent="@keyframes ripple{to{transform:scale(4);opacity:0}}";
    document.head.appendChild(style);
    let pullStartY=0,pullCurrentY=0,isPulling=false,isRefreshing=false;
    const pullIndicator=$("#pullIndicator"),pullText=$("#pullText");
    const PULL_THRESHOLD=80;
    function initPullToRefresh(){
      const main=$(".main");
      if(!main)return;
      main.addEventListener("touchstart",e=>{
        if(main.scrollTop<=0&&!isRefreshing){pullStartY=e.touches[0].clientY;isPulling=true}
      },{passive:true});
      main.addEventListener("touchmove",e=>{
        if(!isPulling||isRefreshing)return;
        pullCurrentY=e.touches[0].clientY;
        const diff=pullCurrentY-pullStartY;
        if(diff>0&&main.scrollTop<=0){
          const progress=Math.min(diff/PULL_THRESHOLD,1);
          pullIndicator.style.transform=`translateX(-50%) translateY(${Math.min(diff*0.5,60)-60}px)`;
          pullIndicator.style.opacity=progress;
          pullText.style.opacity=progress;
          pullText.style.transform=`translateX(-50%) translateY(${Math.min(diff*0.5,60)-40}px)`;
          if(progress>=1){pullText.textContent="Suelta para actualizar"}else{pullText.textContent="Desliza para actualizar"}
        }
      },{passive:true});
      main.addEventListener("touchend",()=>{
        if(!isPulling||isRefreshing)return;
        const diff=pullCurrentY-pullStartY;
        if(diff>PULL_THRESHOLD&&main.scrollTop<=0){refreshData()}
        else{resetPull()}
        isPulling=false;
      });
    }
    async function refreshData(){
      isRefreshing=true;
      pullIndicator.classList.add("refreshing");
      pullText.textContent="Actualizando...";
      pullText.classList.add("show");
      try{await boot();toast("Datos actualizados","ok")}
      catch(e){toast("Error al actualizar","bad")}
      finally{resetPull();isRefreshing=false}
    }
    function resetPull(){
      pullIndicator.classList.remove("show","refreshing");
      pullIndicator.style.transform="translateX(-50%) translateY(-60px)";
      pullIndicator.style.opacity="0";
      pullText.classList.remove("show");
      pullText.style.opacity="0";
      pullText.style.transform="translateX(-50%) translateY(-20px)";
    }

    // ─── API ───────────────────────────────────────────
    async function api(path,opt={}){
      if(!navigator.onLine) throw new Error("Sin conexion a internet");
      const res = await fetch(API + "/" + path, {
        ...opt,
        headers: {"Content-Type":"application/json", ...(token ? {"x-distrito-session":token} : {}), ...(opt.headers || {})}
      });
      const json = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(json.error || "No se pudo conectar con el servidor");
      return json;
    }
    function toast(msg,type=""){
      const node=$("#toast"); node.textContent=msg; node.className="toast show " + type;

    function serviceClass(name=""){
      const n=name.toLowerCase();
      if(n.includes("netflix"))return"netflix"; if(n.includes("prime"))return"prime"; if(n.includes("max")||n.includes("hbo"))return"max";
      if(n.includes("disney"))return"disney"; if(n.includes("spotify"))return"spotify"; if(n.includes("youtube"))return"youtube"; return"other";
    }
    function serviceName(name=""){return String(name).replace(/pantalla|semi|estandar|premium|dispositivo|1m/ig,"").trim().split(/\s+/).slice(0,2).join(" ") || name;}

    // ─── PRECIOS Y GANANCIA ────────────────────────────
    function salePrice(p){
      const provider = Number(p.provider_price ?? p.base_price ?? 0);
      const base = Number(p.base_price ?? provider);
      if(isAdmin()) return base;
      const margin = Number(state.user?.margin ?? 0);
      return provider + Math.max(0, margin);
    }
    function profitFromRecharge(amount){ return Math.round(amount * PROFIT_RATE); }

    // ─── CONTROLES ─────────────────────────────────────
    function daysLeft(date){
      if(!date)return null;
      const today=new Date(); today.setHours(0,0,0,0);
      const end=new Date(date+"T00:00:00"); return Math.ceil((end-today)/86400000);
    }
    function operatorCount(productId){
      return state.orders.filter(o => {
        const left = daysLeft(o.expires_at);
        const status = String(o.status||"").toLowerCase();
        return o.product_id === productId && (left === null || left >= 0 || status.includes("pend") || status.includes("proces"));
      }).length;
    }
    function canBuyProduct(p){
      if(p.shared === false || String(p.share_type||"").toLowerCase() === "personal") {
        return operatorCount(p.id) < 1;
      }
      return operatorCount(p.id) < MAX_OPERATORS_PER_PRODUCT;
    }

      if(kind==="compra") return `Estos son los datos de tu pedido:\n\nProducto: ${o.product_name}\nCuenta: ${o.delivered_data || "-"}\nFecha de vencimiento: ${o.expires_at || "-"}\n\nGracias por tu compra.`;
      return `Claro que si, estos son tus datos:\n\nProducto: ${o.product_name}\nCuenta: ${o.delivered_data || "-"}\nFecha de vencimiento: ${o.expires_at || "-"}\nVence en: ${left ?? "-"} dias\n\nCualquier duda quedamos atentos.`;
    }

    async function login(){
      const btn=$("#loginBtn");
      try{
        const email=$("#email").value.trim(), password=$("#password").value;
        if(!email || !password) return toast("Ingresa correo y contraseña","bad");
        btn?.classList.add("loading");
        showLoading("Ingresando...");

        // Pre-verificar si el usuario está bloqueado (funciona cuando el Edge Function
        // tiene la ruta /check-user-status, sino falla silenciosamente)
        try{
          const check=await api("check-user-status",{method:"POST",body:JSON.stringify({email})});
          if(check.blocked){showBlockedModal();return}
        }catch(_){}

        const res=await api("login",{method:"POST",body:JSON.stringify({email,password})});

        // Si el Edge Function devolvió blocked:true
        if(res.blocked){showBlockedModal();return}

        token=res.token || res.session; localStorage.dsToken=token; state.user=res.user;
        if(state.user.status==="Bloqueado"||state.user.status==="Inactivo"){
          token=""; localStorage.removeItem("dsToken"); state.user=null;
          showBlockedModal();
          return;
        }
        if($("#rememberMe")?.checked){localStorage.dsRememberEmail=email}else{localStorage.removeItem("dsRememberEmail")}
        await boot(); toast("Bienvenido, " + state.user.name,"ok");
      }catch(e){
        const msg=(e.message||"").toLowerCase();
        if(msg.includes("bloqueado")||msg.includes("blocked")||msg.includes("inactivo")||msg.includes("inactive")||msg.includes("suspendido")||msg.includes("suspended")){
          showBlockedModal();
        }else{
          toast(e.message||"Correo o contraseña incorrectos","bad");
        }
      }
      finally{btn?.classList.remove("loading");hideLoading()}
    }
    async function boot(){
      showLoading("Cargando datos...");
      try{
        const res=await api("bootstrap");
        state={...emptyState(),...res,view:state.view || "home"};
        // Cargar settings de pago desde API si estan disponibles
        if(state.settings && state.settings.payment){
          paymentSettings={...DEFAULT_PAYMENT,...state.settings.payment};
          updatePaymentConstants();
        } else {
          // Intentar cargar settings directamente
          try{
            const settingsRes=await api("settings");
            if(settingsRes && settingsRes.payment){
              if(!state.settings) state.settings={};
              state.settings.payment=settingsRes.payment;
              paymentSettings={...DEFAULT_PAYMENT,...settingsRes.payment};
              updatePaymentConstants();
            }
          }catch(e){}
        }
        // Siempre intentar cargar desde localStorage como fallback
        try{
          const local=JSON.parse(localStorage.dsPayment||"null");
          if(local&&local.number){
            // Si la API no tiene settings, usar localStorage
            if(!state.settings||!state.settings.payment||!state.settings.payment.number){
              paymentSettings={...DEFAULT_PAYMENT,...local};
              updatePaymentConstants();
            }
          }
        }catch(e){}
        if(!state.user) throw new Error("Sesion invalida");
        normalizeViewForRole();
        renderApp();
        checkBalanceAlerts();
      }finally{hideLoading()}
    }

    // ─── CAROUSEL JS ───
    let currentSlide = 0;
    let carouselInterval;
    function moveCarousel(dir){
      const track = document.getElementById("carouselTrack");
      if(!track) return;
      const slides = track.children.length;
      currentSlide = (currentSlide + dir + slides) % slides;
      updateCarousel();
    }
    function goToSlide(i){
      currentSlide = i;
      updateCarousel();
    }
    function updateCarousel(){
      const track = document.getElementById("carouselTrack");
      if(!track) return;
      track.style.transform = `translateX(-${currentSlide * 100}%)`;
      document.querySelectorAll(".carousel-dot").forEach((d,i) => {
        d.classList.toggle("active", i === currentSlide);
      });
    }
    function startCarousel(){
      clearInterval(carouselInterval);
      carouselInterval = setInterval(() => moveCarousel(1), 5000);
    }
    function balanceAlertCard(){
      const bal = Number(state.user?.balance || 0);

      return `<section class="alert-card ${cls}"><b>${msg}</b> Saldo actual: ${money(bal)}</section>`;

    function saveSettings(){
      const name=$("#cfgName").value.trim();
      const number=$("#cfgNumber").value.trim();
      const link=$("#cfgLink").value.trim();
      if(!number){return toast("Ingresa un numero de pago","bad")}
      if(!link){return toast("Ingresa el link de Wompi","bad")}
      const qrFile=($("#cfgQrFile")||{})?.files?.[0];
      const saveData=(qrValue)=>{
        const newData={number,link,name:name||"Distrito Streaming",qr:qrValue};
        // Actualizar inmediatamente las variables globales
        paymentSettings={...newData};
        updatePaymentConstants();
        // Guardar en API
        api("settings",{method:"PUT",body:JSON.stringify({key:"payment",value:newData})})
          .then(()=>{
            if(!state.settings) state.settings={};
            state.settings.payment=newData;
            localStorage.dsPayment=JSON.stringify(newData);
            toast("Configuracion guardada. Recargando...","ok");
            // Forzar recarga completa para que TODO se actualice
            setTimeout(()=>location.reload(),500);
          })
          .catch(()=>{
            localStorage.dsPayment=JSON.stringify(newData);
            toast("Configuracion guardada. Recargando...","ok");
            setTimeout(()=>location.reload(),500);
          });
      };
      if(qrFile){
        const reader=new FileReader();
        reader.onload=function(e){
          const img=new Image();
          img.onload=function(){
            const canvas=document.createElement('canvas');
            const maxSize=400;
            let w=img.width,h=img.height;
            if(w>maxSize||h>maxSize){if(w>h){h=Math.round(h*maxSize/w);w=maxSize}else{w=Math.round(w*maxSize/h);h=maxSize}}
            canvas.width=w;canvas.height=h;
            canvas.getContext('2d').drawImage(img,0,0,w,h);
            saveData(canvas.toDataURL('image/jpeg',0.8));
          };
          img.src=e.target.result;
        };
        reader.readAsDataURL(qrFile);
      }else{
        saveData(paymentSettings.qr||'nequi-negocios-qr.jpeg');
      }
    }

    function parseSTGLIAKData(text){
      const lines=text.split("\n").filter(l=>l.trim());
      const accounts=[];
      // Detectar si es formato WhatsApp (con *Producto:* o *Cuenta:*)
      const isWhatsAppFormat=lines.some(l=>l.includes("*Producto:*")||l.includes("*Cuenta:*")||l.includes("Producto:")||l.includes("Cuenta:"));
      if(isWhatsAppFormat){
        // Formato WhatsApp: agrupar por bloques separados por lineas vacias o cambios
        let currentProduct="",currentExpiry="",currentAccount="";
        for(const line of lines){
          const clean=line.replace(/\*/g,"").replace(/🎨|✉️|📅/g,"").trim();
          if(clean.toLowerCase().includes("producto:")){
            currentProduct=clean.split(":").slice(1).join(":").trim();
          } else if(clean.toLowerCase().includes("fecha de vencimiento:")||clean.toLowerCase().includes("vencimiento:")){
            currentExpiry=clean.split(":").slice(1).join(":").trim();
          } else if(clean.toLowerCase().includes("cuenta:")){
            currentAccount=clean.split(":").slice(1).join(":").trim();
          }
          // Cuando tenemos cuenta, parsear los datos
          if(currentAccount && currentAccount.includes("@")){
            const accParts=currentAccount.split(":").map(p=>p.replace(/\*/g,"").trim()).filter(p=>p);
            if(accParts.length>=2){
              accounts.push({
                product:currentProduct,
                email:accParts[0],
                password:accParts[1],
                profile:accParts[2]||"",
                pin:accParts[3]||"",
                purchaseDate:"",
                expiryDate:currentExpiry
              });
            }
            currentAccount="";
          }
        }
      } else {
        // Formato tabla STGLIAK o simple
        for(const line of lines){
          const parts=line.split("|").map(p=>p.trim()).filter(p=>p);
          if(parts.length>=2){
            const accountData=parts[1]||parts[0];
            const accParts=accountData.split(":").map(p=>p.trim()).filter(p=>p);
            if(accParts.length>=2 && (accParts[0].includes("@") || accParts[0].includes("."))){
              accounts.push({
                product:parts[0]||"",
                email:accParts[0],
                password:accParts[1],
                profile:accParts[2]||"",
                pin:accParts[3]||"",
                purchaseDate:parts[2]||"",
                expiryDate:parts[3]||""
              });
            }
          } else {
            const accParts=line.split(":").map(p=>p.trim()).filter(p=>p);
            if(accParts.length>=2 && (accParts[0].includes("@") || accParts[0].includes("."))){
              accounts.push({
                product:"",
                email:accParts[0],
                password:accParts[1],
                profile:accParts[2]||"",
                pin:accParts[3]||"",
                purchaseDate:"",
                expiryDate:""
              });
            }
          }
        }
      }
      return accounts;
    }
    function previewImport(){
      const text=$("#importData").value;
      const accounts=parseSTGLIAKData(text);
      const preview=$("#importPreview");
      if(!accounts.length){

    async function importFromSTGLIAK(){
      const text=$("#importData").value;
      const defaultProductId=$("#importProduct").value;
      const accounts=parseSTGLIAKData(text);
      if(!accounts.length) return toast("No se encontraron cuentas","bad");
      showLoading(`Importando ${accounts.length} cuentas...`);
      const products=state.products||[];
      let imported=0;
      for(const acc of accounts){
        try{
          // Buscar producto por nombre en STGLIAK
          let productId=defaultProductId;
          if(acc.product){
            const found=products.find(p=>p.name.toLowerCase().includes(acc.product.toLowerCase().split(" ")[0].toLowerCase()));
            if(found) productId=found.id;
          }
          await api("inventory",{method:"POST",body:JSON.stringify({
            product_id:productId,
            email:acc.email,
            password:acc.password,
            profile:acc.profile,
            pin:acc.pin,
            purchase_date:acc.purchaseDate,
            expiry_date:acc.expiryDate,
            status:"Disponible"
          })});
          imported++;
        }catch(e){}
      }
      toast(`${imported} cuentas importadas`,"ok");
      $("#importData").value="";
      $("#importPreview").style.display="none";
      await boot();
      hideLoading();
    }

    // ─── TIENDA / INVENTARIO ───────────────────────────
    function store(){
      const sorted=[...state.products].sort((a,b)=>(b.status==="Disponible")-(a.status==="Disponible") || Number(b.stock||0)-Number(a.stock||0));
      const available=sorted.filter(p=>p.status==="Disponible" && Number(p.stock)>0);
      const unavailable=sorted.filter(p=>!(p.status==="Disponible" && Number(p.stock)>0));
      const visible=isAdmin()?sorted:available;
      return `<section class="card" style="padding:12px 14px">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">

        </div>
      </section>
      <section class="grid store-grid section">${visible.map(productCard).join("") || "<p class='muted'>No hay productos disponibles ahora.</p>"}</section>

    function updateBuyTotal(price){

      if($("#buyQtyLabel")) $("#buyQtyLabel").textContent=`${qty} pantalla${qty>1?"s":""}`;

      const el=$("#buyState");
      if(ok){el.style.background="rgba(18,164,84,.08)";el.style.color="#166534";el.style.border="1px solid rgba(18,164,84,.2)";el.innerHTML=`<span style="display:inline-block;margin-right:4px">&#10003;</span> Listo para comprar ${qty} pantalla${qty>1?"s":""}.`}
      else{el.style.background="rgba(239,68,68,.08)";el.style.color="#991b1b";el.style.border="1px solid rgba(239,68,68,.2)";el.innerHTML=`<span style="display:inline-block;margin-right:4px">&#9888;</span> Saldo insuficiente. Faltan ${money(total-bal)}.`}
    }
    async function finishBuy(id){
      try{
        showLoading("Procesando compra...");

        const delivered = res.orders||[];
        state.orders=[...delivered,...state.orders];
        if(res.balance!==undefined) state.user.balance=res.balance;
        renderDelivery(delivered);
        await boot();
      }catch(e){toast(e.message,"bad")}

    // ─── ORDENES ───────────────────────────────────────

      return `<div class="table-wrap"><table>

            <td style="text-align:center"><div style="display:flex;gap:4px;justify-content:center">

              <button onclick="openReport('${o.id}')" title="Reportar problema" style="padding:6px 10px;border:1px solid rgba(239,68,68,.3);border-radius:8px;background:rgba(239,68,68,.05);cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--bad);transition:all .15s" onmouseover="this.style.background='rgba(239,68,68,.1)'" onmouseout="this.style.background='rgba(239,68,68,.05)'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>Reportar</button>

    function parseAccount(text){
      const parts=String(text||"").split(":").map(x=>x.trim()).filter(Boolean);
      return {email:parts[0]||"",password:parts[1]||"",profile:(parts.find(x=>/^P\d+/i.test(x))||parts[2]||""),pin:(parts.find(x=>/\d{4}/.test(x))||parts[3]||"")};

    function safeOrder(o){return encodeURIComponent(JSON.stringify({product_name:o.product_name,delivered_data:o.delivered_data,expires_at:o.expires_at}))}

    function exportOrdersCsv(){
      const rows=state.orders.map(o=>[o.code,o.product_name,o.client_name,o.status,o.expires_at,o.delivered_data].map(csvCell).join(";")).join("\n");

    function csvCell(v){return `"${String(v??"").replaceAll('"','""')}"`}
    function downloadFile(name,content){
      const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([content],{type:"text/csv;charset=utf-8"})); a.download=name; a.click(); URL.revokeObjectURL(a.href);
    }

    // ─── HISTORIAL DE MOVIMIENTOS ──────────────────────
    function history(){
      const movements = [];

      // Agregar recargas (créditos)
      state.topups.forEach(t => {
        if(t.status === "Aprobada") {
          movements.push({
            date: t.created_at || t.approved_at || "",
            amount: Number(t.amount || 0),
            type: "crédito",
            description: `Recarga ${t.method || "Nequi/Wompi"}`,
            icon: "💰",
            color: "#16a34a"
          });
        }
      });

      // Agregar compras (débitos)
      state.orders.forEach(o => {
        movements.push({
          date: o.created_at || o.expires_at || "",
          amount: -(Number(o.amount || o.total || 0)),
          type: "débito",
          description: `Compra de: ${o.product_name || "Producto"}`,
          icon: "🛒",
          color: "#ef4444"
        });
      });

      // Ordenar por fecha (más reciente primero)
      movements.sort((a,b) => (b.date || "").localeCompare(a.date || ""));

      // Calcular totales
      const totalCredito = movements.filter(m => m.amount > 0).reduce((s,m) => s + m.amount, 0);
      const totalDebito = movements.filter(m => m.amount < 0).reduce((s,m) => s + Math.abs(m.amount), 0);
      const balance = totalCredito - totalDebito;

      return `
        <div class="card" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
            <div style="display:flex;align-items:center;gap:12px">
              <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center">
                ${icons.history}

    function exportHistoryCsv(){
      const movements = [];
      state.topups.forEach(t => {
        if(t.status === "Aprobada") {
          movements.push([t.created_at || "", `$${Number(t.amount||0).toLocaleString("es-CO")}`, "Crédito", `Recarga ${t.method||"Nequi/Wompi"}`]);
        }
      });
      state.orders.forEach(o => {
        movements.push([o.created_at || "", `-$${Number(o.amount||o.total||0).toLocaleString("es-CO")}`, "Débito", `Compra: ${o.product_name||"Producto"}`]);
      });
      movements.sort((a,b) => (b[0]||"").localeCompare(a[0]||""));
      const rows = movements.map(m => m.map(v => `"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");
      downloadFile("distrito-movimientos.csv", "\ufeffFecha;Monto;Tipo;Descripción\n" + rows);
      toast("Historial exportado", "ok");
    }

    // ─── REPORTES ──────────────────────────────────────
    function reports(){
      if(isAdmin()) return reportsAdmin();
      return reportsUser();
    }
    function reportsAdmin(){
      const all=state.reports;
      const pending=all.filter(r=>r.status!=="Resuelto"&&r.status!=="Rechazado").length;
      const solved=all.filter(r=>r.status==="Resuelto").length;
      const rejected=all.filter(r=>r.status==="Rechazado").length;
      return `
      <section class="card" style="overflow:hidden">
        <div style="display:flex;gap:0;border-bottom:1px solid var(--line)">
          <button onclick="filterReportTable('all')" class="report-tab active" style="flex:1;padding:14px 16px;border:0;border-bottom:2px solid var(--blue);background:transparent;color:var(--blue);font-weight:800;font-size:13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px">
            Pendientes <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(8,119,255,.1);color:var(--blue)">${pending}</span>
          </button>
          <button onclick="filterReportTable('Resuelto')" class="report-tab" style="flex:1;padding:14px 16px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px">
            Resueltos <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(16,185,129,.1);color:var(--ok)">${solved}</span>
          </button>
          <button onclick="filterReportTable('Rechazado')" class="report-tab" style="flex:1;padding:14px 16px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px">
            Rechazados <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(239,68,68,.1);color:var(--bad)">${rejected}</span>
          </button>
          <button onclick="filterReportTable('all')" class="report-tab" style="flex:1;padding:14px 16px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px">
            Todos <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(107,114,128,.1);color:var(--muted)">${all.length}</span>
          </button>
        </div>
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr style="background:var(--soft);border-bottom:1px solid var(--line)">
                <th style="padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Fecha</th>
                <th style="padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Producto</th>
                <th style="padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Motivo</th>
                <th style="padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Estado</th>
                <th style="padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Seguimiento</th>
                <th style="padding:10px 16px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Accion</th>
              </tr>
            </thead>
            <tbody id="reportTableBody">
              ${reportTableRows(all)}
            </tbody>
          </table>
        </div>
      </section>`;
    }
    function reportTableRows(rows){
      if(!rows.length) return `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted)"><div style="font-size:14px;font-weight:600;margin-bottom:4px">Sin reportes</div><div style="font-size:12px">Los reportes apareceran aqui</div></td></tr>`;
      return rows.map(r=>{
        const statusColor=r.status==="Resuelto"?"var(--ok)":r.status==="Rechazado"?"var(--bad)":"var(--warn)";
        const statusBg=r.status==="Resuelto"?"rgba(16,185,129,.1)":r.status==="Rechazado"?"rgba(239,68,68,.1)":"rgba(245,158,11,.1)";
        const statusIcon=r.status==="Resuelto"?"✓":r.status==="Rechazado"?"✗":"●";
        const isOpen=r.status!=="Resuelto"&&r.status!=="Rechazado";
        const cls=serviceClass(r.product_name);
        const logo={netflix:`<div style="width:20px;height:20px;background:#E50914;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff">N</div>`,spotify:`<div style="width:20px;height:20px;background:#1DB954;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px">♫</div>`,max:`<div style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;background:#1a1a2e;border-radius:3px">max</div>`,prime:`<div style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:700;color:#00A8E1;border:1px solid #00A8E1;border-radius:3px">PV</div>`,disney:`<div style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:700;color:#fff;background:#0a74ff;border-radius:3px">D+</div>`,youtube:`<div style="width:20px;height:20px;background:#FF0000;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff">▶</div>`}[cls]||`<div style="width:20px;height:20px;background:#7AA6C8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff">?</div>`;
        return `<tr style="border-bottom:1px solid var(--line);transition:background .15s" onmouseover="this.style.background='var(--soft)'" onmouseout="this.style.background=''">
          <td style="padding:12px 16px"><span style="font-size:12px;color:var(--muted)">${r.created_at||r.date||"-"}</span></td>
          <td style="padding:12px 16px"><div style="display:flex;align-items:center;gap:8px">${logo}<span style="font-weight:700;font-size:13px">${esc(r.product_name||"-")}</span></div></td>
          <td style="padding:12px 16px"><span style="font-size:12px">${esc(r.reason||"-")}</span></td>
          <td style="padding:12px 16px"><span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;color:${statusColor};background:${statusBg}"><span style="font-size:8px">${statusIcon}</span>${r.status||"Pendiente"}</span></td>
          <td style="padding:12px 16px"><span style="font-size:12px;color:${r.provider_response?'var(--ok)':'var(--muted)'}">${r.provider_response?esc(r.provider_response).slice(0,40)+(r.provider_response.length>40?"...":""):"-"}</span></td>
          <td style="padding:12px 16px;text-align:center"><div style="display:flex;gap:4px;justify-content:center">
            ${isOpen?`<button onclick="resolveReport('${r.id}','Resuelto')" style="padding:5px 10px;border:0;border-radius:6px;background:rgba(16,185,129,.1);color:var(--ok);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s" onmouseover="this.style.background='rgba(16,185,129,.2)'" onmouseout="this.style.background='rgba(16,185,129,.1)'">Resolver</button>`:""}
            ${isOpen?`<button onclick="resolveReport('${r.id}','Rechazado')" style="padding:5px 10px;border:0;border-radius:6px;background:rgba(239,68,68,.1);color:var(--bad);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s" onmouseover="this.style.background='rgba(239,68,68,.2)'" onmouseout="this.style.background='rgba(239,68,68,.1)'">Rechazar</button>`:""}
            <button onclick="openReportDetail('${r.id}')" style="padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s" onmouseover="this.style.background='var(--soft)'" onmouseout="this.style.background='var(--panel)'">Ver</button>
          </div></td>
        </tr>`;
      }).join("");
    }
    function filterReportTable(filter){
      const rows=filter==="all"?state.reports:state.reports.filter(r=>r.status===filter||(filter==="all"));
      const el=$("#reportTableBody");
      if(el) el.innerHTML=reportTableRows(rows);
      // Actualizar tabs activos
      document.querySelectorAll(".report-tab").forEach(tab=>{
        tab.style.borderBottomColor="transparent";
        tab.style.color="var(--muted)";
      });
      event.target.closest(".report-tab").style.borderBottomColor="var(--blue)";
      event.target.closest(".report-tab").style.color="var(--blue)";
    }
    function openReportDetail(id){
      const r=state.reports.find(x=>x.id===id);
      if(!r) return;
      const isOpen=r.status!=="Resuelto"&&r.status!=="Rechazado";
      // Determinar paso actual del timeline
      let currentStep=0;
      if(r.status==="Resuelto") currentStep=3;
      else if(r.status==="En revision"||r.provider_response) currentStep=2;
      else if(r.status==="Asignado") currentStep=1;
      else currentStep=0; // Recibido/Pendiente

      const steps=[
        {label:"Recibido",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>`},
        {label:"Asignado",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`},
        {label:"En revision",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`},
        {label:"Resuelto",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg>`}
      ];

      openModal(`<div style="padding:0">
        <!-- Header -->
        <div style="padding:20px 20px 16px;border-bottom:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;align-items:start">
            <div>
              <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">SOPORTE</div>
              <h2 style="margin:0;font-size:17px;font-weight:900">${esc(r.product_name||"Reporte")}</h2>
              <div style="font-size:12px;color:var(--muted);margin-top:4px">Reporte: <b>${r.code||"-"}</b> · ${r.created_at||""}</div>
            </div>
            <button onclick="closeModal()" style="width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;transition:all .15s" onmouseover="this.style.background='var(--soft)'" onmouseout="this.style.background='var(--panel)'">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" width="16" height="16"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>

        <!-- Timeline -->
        <div style="padding:20px;border-bottom:1px solid var(--line)">
          <div style="display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:8px">
            <div style="position:absolute;top:18px;left:24px;right:24px;height:3px;background:var(--line);border-radius:2px"></div>
            <div style="position:absolute;top:18px;left:24px;width:${currentStep===0?0:currentStep===1?33:currentStep===2?66:100}%;height:3px;background:linear-gradient(90deg,#0877ff,#10b981);border-radius:2px;transition:width .5s"></div>
            ${steps.map((s,i)=>`
              <div style="display:flex;flex-direction:column;align-items:center;gap:6px;z-index:1;position:relative">
                <div style="width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px;transition:all .3s;${i<=currentStep?'background:linear-gradient(135deg,#0877ff,#0057dc);color:#fff;box-shadow:0 4px 12px rgba(8,119,255,.3)':'background:var(--soft);color:var(--muted);border:2px solid var(--line)'}">
                  ${s.icon}
                </div>
                <span style="font-size:10px;font-weight:700;color:${i<=currentStep?'var(--blue)':'var(--muted)'};white-space:nowrap">${s.label}</span>
              </div>
            `).join("")}
          </div>
          <div style="text-align:center;margin-top:8px">
            ${r.status==="Resuelto"?`<span style="font-size:12px;color:var(--ok);font-weight:700">✓ Reporte resuelto</span>`:
              r.status==="Rechazado"?`<span style="font-size:12px;color:var(--bad);font-weight:700">✗ Reporte rechazado</span>`:
              `<span style="font-size:12px;color:var(--warn);font-weight:600">⏱ En proceso de atencion</span>`}
          </div>
        </div>

        <!-- Detalles -->
        <div style="padding:16px 20px;display:grid;gap:12px">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <span class="tag ${r.status==='Resuelto'?'ok':r.status==='Rechazado'?'bad':'warn'}" style="font-size:10px">${r.status||"Pendiente"}</span>
            <span style="font-size:12px;color:var(--muted)">${r.reason||""}</span>
          </div>
          ${r.description?`<div style="padding:12px;background:var(--soft);border-radius:8px;font-size:13px">${esc(r.description)}</div>`:""}
          ${r.account_data?`<div style="font-size:12px;color:var(--muted)">Cuenta: <span style="font-family:monospace;background:var(--soft);padding:2px 6px;border-radius:4px">${esc(r.account_data)}</span></div>`:""}
          ${r.provider_response?`<div style="padding:10px 12px;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15);border-radius:8px;font-size:12px"><b style="color:var(--ok)">Respuesta del equipo:</b><br>${esc(r.provider_response)}</div>`:""}

          ${isOpen?`<div style="border-top:1px solid var(--line);padding-top:12px">
            <div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px">Respuesta rapida</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
              ${["Cuenta reemplazada.","PIN actualizado.","Cuenta restaurada.","Funcionando correctamente.","Reembolso procesado."].map(t=>`<button onclick="$('#detailResp-${r.id}').value='${t}'" style="padding:4px 10px;border:1px dashed var(--line);border-radius:6px;background:var(--panel);font-size:10px;cursor:pointer;color:var(--text);transition:all .15s" onmouseover="this.style.background='var(--soft)'" onmouseout="this.style.background='var(--panel)'">${t.slice(0,25)}</button>`).join("")}
            </div>
            <div style="display:flex;gap:8px">
              <input id="detailResp-${r.id}" placeholder="Escribe la solucion..." style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--soft);color:var(--text)">
              <button onclick="sendDetailResponse('${r.id}')" style="padding:10px 16px;border:0;border-radius:8px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap">Resolver</button>
            </div>
          </div>`:""}
        </div>
      </div>`);
    }
    function sendDetailResponse(id){
      const input=$(`#detailResp-${id}`);
      if(!input||!input.value.trim()) return;
      resolveReport(id,"Resuelto",input.value.trim());
      closeModal();
    }
    function searchReports(q){
      const query=(q||"").toLowerCase();
      const filtered=state.reports.filter(r=>`${r.code||""} ${r.product_name||""} ${r.reason||""} ${r.description||""} ${r.account_data||""} ${r.client_name||""}`.toLowerCase().includes(query));
      const el=$("#reportTableBody");
      if(el) el.innerHTML=reportTableRows(filtered);
    }
    function reportsUser(){
      const my=state.reports;
      const open=my.filter(r=>r.status!=="Resuelto").length;
      return `

    function checkOrderReport(){

      const warning=$("#rpOrderWarning");
      const btn=$("#rpSubmitBtn");
      if(!orderId||!warning) return;
      const existing=state.reports.find(r=>r.order_id===orderId&&r.status!=="Resuelto"&&r.status!=="Rechazado");
      if(existing){
        warning.style.display="block";
        warning.innerHTML=`⚠️ Ya tienes un reporte abierto para esta compra (<b>${existing.code||"-"}</b>). Espera a que se resuelva.`;
        if(btn) btn.disabled=true;
      }else{
        warning.style.display="none";
        if(btn) btn.disabled=false;
      }
    }
    async function sendReport(){
      const orderId=$("#rpOrder")?.value;
      const existing=state.reports.find(r=>r.order_id===orderId&&r.status!=="Resuelto"&&r.status!=="Rechazado");
      if(existing) return toast("Ya tienes un reporte abierto para esta compra","bad");
      try{
        showLoading("Enviando reporte...");

    function fileToBase64(file){
      return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result);
        reader.onerror=reject;
        reader.readAsDataURL(file);
      });
    }
    function compressAndConvertToBase64(file,maxWidth=800,quality=0.8){
      return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=(e)=>{
          const img=new Image();
          img.onload=()=>{
            const canvas=document.createElement("canvas");
            let w=img.width,h=img.height;
            if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth}
            canvas.width=w;canvas.height=h;
            canvas.getContext("2d").drawImage(img,0,0,w,h);
            resolve(canvas.toDataURL("image/jpeg",quality));
          };
          img.onerror=reject;
          img.src=e.target.result;
        };
        reader.onerror=reject;
        reader.readAsDataURL(file);
      });
    }

        const hit=(`${u.username||u.name} ${u.name} ${u.email}`).toLowerCase().includes(q);
        let filterHit=true;
        if(filter==="Activo") filterHit=(u.status||"Activo")==="Activo";

    async function approveTopup(id){
      const topup = state.topups.find(t=>t.id===id);
      if(!topup) return toast("Recarga no encontrada","bad");
      try{
        showLoading("Aprobando recarga...");
        // Actualizar estado local INMEDIATAMENTE
        const idx=state.topups.findIndex(t=>t.id===id);
        if(idx>=0) state.topups[idx]={...state.topups[idx],status:"Aprobada"};
        // Intentar enviar al servidor
        try{
          await api("topups",{method:"PATCH",body:JSON.stringify({id,status:"Aprobada"})});
        }catch(e1){
          try{await api("topups",{method:"POST",body:JSON.stringify({id,status:"Aprobada"})});}catch(e2){}
        }
        // Guardar en localStorage como respaldo
        const local=JSON.parse(localStorage.dsTopups||"[]");
        const lidx=local.findIndex(t=>t.id===id);
        if(lidx>=0) local[lidx].status="Aprobada";
        else local.push({...topup,status:"Aprobada"});
        localStorage.dsTopups=JSON.stringify(local);
        const userName=topup.user_name||topup.user_email||"Usuario";
        toast(`✓ Recarga de ${money(topup.amount)} aprobada - ${userName}`,"ok");
        hideLoading();
        renderApp();
      }catch(e){
        hideLoading();
        toast("Error: "+e.message,"bad");
      }
    }

    function updateAutoTotal(){

      document.getElementById('autoComision').textContent = amount > 0 ? '$' + commission.toLocaleString('es-CO') : '-';
      document.getElementById('autoTotal').textContent = amount > 0 ? '$' + total.toLocaleString('es-CO') : '-';
    }

    function setQuickAmountAuto(amount,btn){document.querySelectorAll('#paymentMethodContent .quick-amount-btn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');window._wompiAmount=amount}

    function setQuickAmount(amount, btn){
      document.getElementById("tpAmountManual").value = amount;
      document.querySelectorAll(".quick-amount-btn").forEach(b=>b.classList.remove("active"));
      if(btn) btn.classList.add("active");

    function sendWhatsApp(){
      const amount = document.getElementById("tpAmountManual")?.value;
      if(!amount || amount < 1000) return toast("Selecciona o escribe un monto válido","bad");

      const userName = state.user?.name || "Usuario";
      const userEmail = state.user?.email || "";
      const date = new Date().toLocaleDateString("es-CO");
      const time = new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
      const formattedAmount = "$" + Number(amount).toLocaleString("es-CO");

      let msg = `💰 *SOLICITUD DE RECARGA*\\n`;
      msg += `━━━━━━━━━━━━━━━━\\n`;
      msg += `👤 *Cliente:* ${userName}\\n`;
      msg += `📧 *Email:* ${userEmail}\\n`;
      msg += `💵 *Monto:* ${formattedAmount} COP\\n`;
      msg += `📅 *Fecha:* ${date} - ${time}\\n`;
      msg += `━━━━━━━━━━━━━━━━\\n`;
      msg += `Espero datos para realizar el pago. Gracias!`;

      window.open(`${WHATSAPP_LINK}?text=${encodeURIComponent(msg)}`, "_blank");

      const refText = `${userName} - ${formattedAmount}`;
      api("topups",{method:"POST",body:JSON.stringify({amount:Number(amount),method:"WhatsApp",reference:refText})})
        .then(()=>{ toast("Solicitud enviada. Espera datos de pago por WhatsApp.","ok"); closeModal(); })
        .catch(()=>{ toast("Solicitud registrada. Confirma por WhatsApp.","ok"); closeModal(); });
    }

    function payWithWompi(){
      const amount = document.getElementById("tpAmountAuto")?.value || "50000";
      window.open(`${paymentSettings.link||PAYMENT_LINK}?amount=${amount}`, "_blank");
      toast("Redirigiendo a Wompi...","ok");
    }

    // ─── ESTUDIO GENERAL (ANALYTICS) ───────────────────
    function analytics(){
      const totalRevenue = state.orders.reduce((s,o)=>s+Number(o.amount||o.total||0),0);
      const totalTopups = state.topups.filter(t=>t.status==="Aprobada").reduce((s,t)=>s+Number(t.amount||0),0);
      const totalProfit = state.topups.filter(t=>t.status==="Aprobada").reduce((s,t)=>s+profitFromRecharge(Number(t.amount||0)),0);
      const pendingTopups = state.topups.filter(t=>t.status==="Pendiente");
      const openReports = state.reports.filter(r=>r.status!=="Resuelto");
      const closedReports = state.reports.filter(r=>r.status==="Resuelto");
      const activeUsers = state.users.filter(u=>(u.status||"Activo")==="Activo");
      const resellers = state.users.filter(u=>u.role==="Revendedor");
      const clients = state.users.filter(u=>u.role==="Cliente");
      const totalSales = state.orders.length;
      const avgTicket = totalSales > 0 ? Math.round(totalRevenue / totalSales) : 0;

      // Ventas por mes (ultimos 6 meses)
      const months=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
      const salesByMonth={};
      const now=new Date();
      for(let i=5;i>=0;i--){
        const d=new Date(now.getFullYear(),now.getMonth()-i,1);
        const key=d.getMonth();
        salesByMonth[key]={month:months[key],count:0,revenue:0};
      }
      state.orders.forEach(o=>{
        const d=new Date(o.created_at||o.expires_at);
        const key=d.getMonth();
        if(salesByMonth[key]){
          salesByMonth[key].count++;
          salesByMonth[key].revenue+=Number(o.amount||o.total||0);
        }
      });
      const monthData=Object.values(salesByMonth);
      const maxRevenue=Math.max(...monthData.map(m=>m.revenue),1);

      // Top revendedores por ventas
      const resellerStats={};
      state.orders.forEach(o=>{
        const r=o.client_name||o.reseller_name||"";
        if(!resellerStats[r]) resellerStats[r]={name:r,orders:0,revenue:0};
        resellerStats[r].orders++;
        resellerStats[r].revenue+=Number(o.amount||o.total||0);
      });
      const topResellers=Object.values(resellerStats).sort((a,b)=>b.revenue-a.revenue).slice(0,5);

      // Productos mas vendidos
      const productStats = {};
      state.orders.forEach(o => {
        const name = o.product_name || "Desconocido";
        if(!productStats[name]) productStats[name] = { count:0, revenue:0 };
        productStats[name].count++;
        productStats[name].revenue += Number(o.amount||o.total||0);
      });
      const topProducts = Object.entries(productStats).sort((a,b)=>b[1].count-a[1].count).slice(0,5);

      // Cuentas por vencer
      const expiringSoon = state.orders.filter(o => {
        const left = daysLeft(o.expires_at);
        return left !== null && left >= 0 && left <= 7;
      });

      // Meta del mes (ejemplo: $500.000)
      const monthlyGoal=500000;
      const monthlyRevenue=state.orders.filter(o=>{
        const d=new Date(o.created_at||o.expires_at);
        const today=new Date();
        return d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear();
      }).reduce((s,o)=>s+Number(o.amount||o.total||0),0);
      const goalPercent=Math.min(100,Math.round((monthlyRevenue/monthlyGoal)*100));

      return `
        <section class="grid metrics">
          ${metric("Ingresos totales",money(totalRevenue),icons.wallet)}
          ${metric("Recargas recibidas",money(totalTopups),icons.payments)}
          ${metric("Ganancia neta (20%)",money(totalProfit),icons.chart)}
          ${metric("Ticket promedio",money(avgTicket),icons.store)}
        </section>

        <!-- META DEL MES -->
        <div class="card section">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <div><h2 style="margin:0">Meta del mes</h2><p class="muted" style="margin:2px 0 0">Objetivo: ${money(monthlyGoal)}</p></div>
            <span style="font-size:20px;font-weight:1000;color:var(--blue)">${goalPercent}%</span>
          </div>
          <div class="goal-progress">
            <div class="bar-bg"><div class="bar-fill" style="width:${goalPercent}%"></div></div>
            <div class="labels"><span>${money(monthlyRevenue)} completados</span><span>${money(monthlyGoal-monthlyRevenue)} restantes</span></div>
          </div>
        </div>

        <!-- GRAFICO DE VENTAS -->
        <div class="card section">
          <h2>Ventas ultimos 6 meses</h2>
          <p class="muted">Tendencia de ingresos por mes.</p>
          <div class="chart-bar" style="margin-top:16px;padding-bottom:24px">
            ${monthData.map(m=>{
              const height=Math.max(4,(m.revenue/maxRevenue)*100);
              return `<div class="bar" style="height:${height}%"><span class="bar-value">${money(m.revenue)}</span><span class="bar-label">${m.month}</span></div>`;
            }).join("")}
          </div>
        </div>

        <section class="grid split section">
          <!-- RESUMEN -->
          <div class="card">
            <h2>Resumen de operacion</h2>
            <p class="muted">Estudio general del negocio.</p>
            <div class="analytics-card" style="margin-top:10px">
              <div class="analytics-row"><span class="muted">Total ventas</span><b>${totalSales}</b></div>
              <div class="analytics-row"><span class="muted">Usuarios activos</span><b>${activeUsers.length}</b></div>
              <div class="analytics-row"><span class="muted">Revendedores</span><b>${resellers.length}</b></div>
              <div class="analytics-row"><span class="muted">Clientes</span><b>${clients.length}</b></div>
              <div class="analytics-row"><span class="muted">Compras activas</span><b>${activeOrders().length}</b></div>
              <div class="analytics-row"><span class="muted">Pagos pendientes</span><b style="color:var(--warn)">${pendingTopups.length}</b></div>
              <div class="analytics-row"><span class="muted">Reportes abiertos</span><b style="color:var(--bad)">${openReports.length}</b></div>
              <div class="analytics-row"><span class="muted">Reportes resueltos</span><b style="color:var(--ok)">${closedReports.length}</b></div>
            </div>
          </div>

          <!-- TOP PRODUCTOS -->
          <div class="card">
            <h2>Productos mas vendidos</h2>
            <p class="muted">Top 5 por cantidad de ventas.</p>
            <div class="analytics-card" style="margin-top:10px">
              ${topProducts.length?topProducts.map(([name,stat],i)=>`
                <div class="analytics-row"><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:6px;background:${i===0?"#f59e0b":i===1?"#94a3b8":i===2?"#d97706":"var(--soft)"};color:#fff;display:grid;place-items:center;font-size:10px;font-weight:1000;flex-shrink:0">${i+1}</span><div><b>${name}</b><br><span class="mini">${stat.count} ventas</span></div></div><b>${money(stat.revenue)}</b></div>
              `).join(""):`<p class="muted">Sin datos de ventas aun.</p>`}
            </div>
          </div>
        </section>

        <!-- TOP REVENDEDORES -->
        ${topResellers.length?`
        <div class="card section">
          <h2>Top revendedores</h2>
          <p class="muted">Quienes generan mas ingresos.</p>
          <div style="margin-top:12px">
            ${topResellers.map((r,i)=>{
              const rankClass=i===0?"gold":i===1?"silver":i===2?"bronze":"other";
              return `<div class="reseller-rank"><div class="rank ${rankClass}">${i+1}</div><div class="info"><b>${r.name}</b><span>${r.orders} ventas</span></div><div class="amount">${money(r.revenue)}</div></div>`;
            }).join("")}
          </div>
        </div>`:""}

        <!-- CUENTAS POR VENCER -->
        ${expiringSoon.length?`
        <section class="card section">
          <h2>Por vencer (7 dias)</h2>
          <p class="muted">Cuentas que vencen pronto. Considera contactar a los clientes.</p>
          <div class="list section">${expiringSoon.map(o=>{
            const left=daysLeft(o.expires_at);
            return `<div class="list-row"><div><b>${o.product_name}</b><br><span class="muted">${o.client_name||"Cliente"} - ${o.delivered_data||"-"}</span></div><div class="row-actions"><span class="tag bad">${left} dias</span><button class="ghost" onclick="copyText(decodeOrderMessage('${safeOrder(o)}','renovar'))">${icons.copy} Mensaje renovar</button></div></div>`;
          }).join("")}</div>
        </section>`:""}

        <!-- RECOMENDACIONES -->
        <section class="card section">
          <h2>Recomendaciones</h2>
          <p class="muted">Sugerencias automaticas basadas en el estado actual.</p>
          <div class="list section">
            ${pendingTopups.length>0?`<div class="alert-card danger"><b>${pendingTopups.length} recargas pendientes</b> - Revisa y aprueba lo mas pronto para mantener el flujo.</div>`:""}
            ${openReports.length>0?`<div class="alert-card"><b>${openReports.length} reportes abiertos</b> - Intenta resolver los reportes viejos primero.</div>`:""}
            ${expiringSoon.length>0?`<div class="alert-card info"><b>${expiringSoon.length} cuentas por vencer</b> - Envia mensajes de renovacion a los clientes.</div>`:""}
            ${resellers.length===0?`<div class="alert-card info"><b>Sin revendedores</b> - Crea revendedores para ampliar tu red de ventas.</div>`:""}
            ${goalPercent<50?`<div class="alert-card warn"><b>Vas al ${goalPercent}% de la meta</b> - Estas por debajo del ritmo ideal. Activa promociones.</div>`:""}
          </div>
        </section>`;
    }

    // ─── UTILIDADES ────────────────────────────────────

        </div>
        ${!isAdmin()?`
        <div style="background:linear-gradient(135deg,rgba(8,119,255,.06),rgba(8,119,255,.02));border:1.5px solid rgba(8,119,255,.15);border-radius:14px;padding:18px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <span style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Saldo Disponible</span>
            <span style="font-size:28px;font-weight:1000;color:var(--blue);letter-spacing:-.02em">${money(bal)}</span>

          <button onclick="closeModal();openTopup()" style="width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#0877ff,#0057dc);color:#fff;font-weight:800;font-size:13px;cursor:pointer;transition:all .2s;box-shadow:0 6px 20px rgba(8,119,255,.25)" onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 8px 24px rgba(8,119,255,.35)'" onmouseout="this.style.transform='';this.style.boxShadow='0 6px 20px rgba(8,119,255,.25)'">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="16" height="16" style="vertical-align:middle;margin-right:6px"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            Recargar Saldo

        </div>`:""}
        <div style="display:grid;gap:10px;margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:12px">

              <svg viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" width="20" height="20"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Telefono</div>
              <div style="font-size:14px;font-weight:700;color:var(--text)">${u.phone||"3102765347"}</div>
            </div>
            <button onclick="copyText('${u.phone||"3102765347"}')" style="padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--blue);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='rgba(8,119,255,.3)'" onmouseout="this.style.borderColor='var(--line)'">Copiar</button>
          </div>
          <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:12px">
            <div style="width:40px;height:40px;border-radius:10px;background:rgba(16,185,129,.1);display:grid;place-items:center;flex-shrink:0">
              <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" width="20" height="20"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Ubicacion</div>
              <div style="font-size:14px;font-weight:700;color:var(--text)">Bogota, Colombia</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:12px">
            <div style="width:40px;height:40px;border-radius:10px;background:${roleBg};display:grid;place-items:center;flex-shrink:0">
              <svg viewBox="0 0 24 24" fill="none" stroke="${roleColor}" stroke-width="2" width="20" height="20"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Estado</div>
              <div style="font-size:14px;font-weight:700;color:${roleColor}">${u.status||"Activo"}</div>

        </div>
        <div style="display:flex;gap:10px">
          <button onclick="toggleDark()" style="flex:1;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-weight:800;font-size:13px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:8px" onmouseover="this.style.borderColor='rgba(8,119,255,.3)'" onmouseout="this.style.borderColor='var(--line)'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 3a6 6 0 0 0 9 7.5A9 9 0 1 1 12 3Z"/></svg>
            Cambiar tema
          </button>
          <button onclick="logout()" style="flex:1;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-weight:800;font-size:13px;cursor:pointer;transition:all .2s;box-shadow:0 6px 20px rgba(239,68,68,.25);display:flex;align-items:center;justify-content:center;gap:8px" onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 8px 24px rgba(239,68,68,.35)'" onmouseout="this.style.transform='';this.style.boxShadow='0 6px 20px rgba(239,68,68,.25)'">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Cerrar sesion
          </button>
        </div>`);
    }
    function toggleDark(){localStorage.dsDark=localStorage.dsDark==="1"?"0":"1";const icon=document.getElementById('appleTouchIcon');if(icon)icon.href=localStorage.dsDark==="1"?"assets/distrito-angel-blue-v1.png":"assets/distrito-angel-white.png";renderApp()}
    function toggleAlerts(ev){
      ev?.stopPropagation();
      const panel=$("#alerts");
      // Generar notificaciones automaticas
      const notifs=[];
      // Pagos pendientes
      const pendingTopups=state.topups.filter(t=>t.status==="Pendiente");
      if(pendingTopups.length>0) notifs.push({type:"warn",icon:"💰",title:`${pendingTopups.length} pagos pendientes`,body:"Revisa y aprueba los pagos recibidos.",action:"setView('payments')"});
      // Reportes abiertos
      const openReports=state.reports.filter(r=>r.status!=="Resuelto");
      if(openReports.length>0) notifs.push({type:"danger",icon:"⚠️",title:`${openReports.length} reportes abiertos`,body:"Reportes de clientes esperando respuesta.",action:"setView('reports')"});
      // Stock bajo
      const lowStock=state.products.filter(p=>Number(p.stock||0)<=2&&p.status==="Disponible");
      if(lowStock.length>0) notifs.push({type:"warn",icon:"📦",title:`Stock bajo`,body:lowStock.map(p=>p.name).join(", "),action:"setView('store')"});
      // Cuentas por vencer
      const expiring=state.orders.filter(o=>{const left=daysLeft(o.expires_at);return left!==null&&left>=0&&left<=7});
      if(expiring.length>0) notifs.push({type:"info",icon:"⏰",title:`${expiring.length} cuentas por vencer`,body:"Cuentas que vencen en 7 dias o menos.",action:"setView('analytics')"});
      // Usuarios bloqueados recien
      const blocked=state.users.filter(u=>u.status==="Inactivo");
      if(blocked.length>0) notifs.push({type:"info",icon:"🔒",title:`${blocked.length} usuarios bloqueados`,body:"Usuarios con acceso desactivado.",action:"setView('users')"});
      // Notificaciones del servidor
      state.notifications.filter(n=>!n.read_at).forEach(n=>notifs.push({type:"info",icon:"🔔",title:n.title,body:n.body||""}));

      const html=notifs.length?notifs.map(n=>`<div class="list-row" style="padding:10px;cursor:pointer;border-left:3px solid ${n.type==='danger'?'var(--bad)':n.type==='warn'?'var(--warn)':'var(--blue)'}" onclick="${n.action||''};toggleAlerts()">
        <div style="display:flex;gap:10px;align-items:start">
          <span style="font-size:20px;flex-shrink:0">${n.icon}</span>
          <div><b style="font-size:13px">${n.title}</b><p class="mini">${n.body}</p></div>
        </div>
      </div>`).join(""):"<p class='muted' style='padding:20px;text-align:center'>Sin notificaciones nuevas.</p>";
      panel.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)"><b>Notificaciones</b><span style="font-size:12px;color:var(--muted)">${notifs.length} avisos</span></div><div class="list" style="max-height:400px;overflow-y:auto">${html}</div>`;
      panel.classList.toggle("show");
    }
    function toggleUserMenu(ev){
      ev?.stopPropagation();
      const dd=$("#userDropdown");
      if(dd) dd.classList.toggle("show");
    }
    function openQrCode(){
      const u=state.user;
      const qrData=u.id||u.email||"usuario";
      const qrUrl=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}&bgcolor=ffffff&color=111111&margin=10`;
      openModal(`<div class="dialog-head"><div><small class="muted">MI QR</small><h2>Codigo QR personal</h2><p class="muted">Comparte este codigo para que te identifiquen.</p></div><button class="close" onclick="closeModal()">&times;</button></div>
        <div style="text-align:center;padding:20px">
          <div style="width:200px;height:200px;margin:0 auto 16px;background:#fff;border-radius:16px;display:grid;place-items:center;border:2px solid var(--line);overflow:hidden">
            <img src="${qrUrl}" alt="QR Personal" style="width:180px;height:180px" onerror="this.parentElement.innerHTML='<svg viewBox=&quot;0 0 100 100&quot; width=&quot;140&quot; height=&quot;140&quot;><rect x=&quot;5&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;30&quot; rx=&quot;4&quot; fill=&quot;#111&quot;/><rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;20&quot; height=&quot;20&quot; rx=&quot;2&quot; fill=&quot;#fff&quot;/><rect x=&quot;14&quot; y=&quot;14&quot; width=&quot;12&quot; height=&quot;12&quot; rx=&quot;1&quot; fill=&quot;#111&quot;/><rect x=&quot;65&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;30&quot; rx=&quot;4&quot; fill=&quot;#111&quot;/><rect x=&quot;70&quot; y=&quot;10&quot; width=&quot;20&quot; height=&quot;20&quot; rx=&quot;2&quot; fill=&quot;#fff&quot;/><rect x=&quot;74&quot; y=&quot;14&quot; width=&quot;12&quot; height=&quot;12&quot; rx=&quot;1&quot; fill=&quot;#111&quot;/><rect x=&quot;5&quot; y=&quot;65&quot; width=&quot;30&quot; height=&quot;30&quot; rx=&quot;4&quot; fill=&quot;#111&quot;/><rect x=&quot;10&quot; y=&quot;70&quot; width=&quot;20&quot; height=&quot;20&quot; rx=&quot;2&quot; fill=&quot;#fff&quot;/><rect x=&quot;14&quot; y=&quot;74&quot; width=&quot;12&quot; height=&quot;12&quot; rx=&quot;1&quot; fill=&quot;#111&quot;/></svg>'">
          </div>
          <b style="font-size:16px">${esc(u.name)}</b><br>
          <span class="muted" style="font-size:13px">${esc(u.email)}</span><br>
          <span class="tag" style="margin-top:8px;display:inline-flex">${publicRole()}</span>
        </div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="primary" onclick="downloadUserQR('${qrUrl}','${esc(u.name)}')" style="flex:1">Descargar QR</button>
          <button class="ghost" onclick="copyText('${u.id||u.email}');toast('ID copiado','ok')" style="flex:1">Copiar ID</button>
        </div>`);
    }
    function downloadUserQR(url,name){
      const a=document.createElement("a");
      a.href=url;
      a.download=`QR-${name||'Distrito'}.png`;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      toast("QR descargado","ok");
    }
    document.addEventListener("click",e=>{
      if(!e.target.closest("#alerts")&&!e.target.closest(".pill"))$("#alerts")?.classList.remove("show");
      if(!e.target.closest(".user-avatar-btn")&&!e.target.closest(".user-dropdown"))$("#userDropdown")?.classList.remove("show");
    });
    function openModal(html){$("#alerts").classList.remove("show");$("#modal").innerHTML=`<div class="dialog">${html}</div>`;$("#modal").classList.add("show")}
    function closeModal(){$("#modal").classList.remove("show")}
    document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal()});
    function copyText(text){navigator.clipboard?.writeText(text).then(()=>toast("Copiado","ok")).catch(()=>toast("No se pudo copiar","bad"))}
    function downloadQRImage(){
      const qr=paymentSettings.qr||'nequi-negocios-qr.jpeg';
      const a=document.createElement("a");
      if(qr.startsWith('data:')){
        a.href=qr;
        a.download="QR-Distrito-Streaming.jpeg";
      }else{
        a.href=ASSETS+qr;
        a.download="QR-Distrito-Streaming-Nequi.jpeg";
      }
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      toast("Imagen QR descargada","ok");
    }
    function downloadAdFile(url,name){
      if(!url){toast("No hay archivo para descargar","bad");return}
      const a=document.createElement("a");
      a.href=url;a.download=name||"archivo";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      toast("Descargando "+name+"...","ok");
    }
    async function copyQRImage(){
      try{
        const qr=paymentSettings.qr||'nequi-negocios-qr.jpeg';
        let blob;
        if(qr.startsWith('data:')){
          const resp=await fetch(qr);
          blob=await resp.blob();
        }else{
          const resp=await fetch(ASSETS+qr);
          blob=await resp.blob();
        }
        await navigator.clipboard.write([new ClipboardItem({"image/blob":blob})]);
        toast("Imagen QR copiada - pega donde quieras","ok");
      }catch(e){
        toast("No se pudo copiar la imagen. Intenta descargar.","bad");
      }
    }
    function escapeJs(text){return String(text||"").replaceAll("\\","\\\\").replaceAll("'","\\'").replaceAll("\n","\\n")}
    function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
    // Paginacion generica
    function paginate(items,page,perPage){
      perPage=perPage||20;
      const total=items.length;
      const totalPages=Math.ceil(total/perPage);
      const start=(page-1)*perPage;
      const sliced=items.slice(start,start+perPage);
      return {items:sliced,page,totalPages,total,start:start+1,end:Math.min(start+perPage,total)};
    }
    function renderPagination(containerId,items,page,perPage,renderFn){
      const p=paginate(items,page,perPage);
      const el=$(containerId);
      if(!el) return;
      let html=`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)">
        <span>Mostrando ${p.start}-${p.end} de ${p.total}</span>
        <div style="display:flex;gap:6px">
          ${p.page>1?`<button onclick="${renderFn}(${p.page-1})" style="padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-size:11px">← Anterior</button>`:""}
          <span style="padding:4px 8px;font-weight:700">Pag ${p.page}/${p.totalPages}</span>
          ${p.page<p.totalPages?`<button onclick="${renderFn}(${p.page+1})" style="padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-size:11px">Siguiente →</button>`:""}
        </div>
      </div>`;
      el.insertAdjacentHTML('beforeend',html);
    }
    // Debounce para busquedas
    function debounce(fn,ms){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms)}}

    // ─── PWA ───────────────────────────────────────────
    window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(localStorage.dsPwaDismissed!=="1")document.getElementById("pwa-banner").classList.add("show")});
    function installPwa(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==="accepted")toast("App instalada","ok");deferredPrompt=null;closePwaBanner()})}
    function closePwaBanner(){document.getElementById("pwa-banner").classList.remove("show");localStorage.dsPwaDismissed="1"}
    if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister()));caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));navigator.serviceWorker.register("sw.js").catch(()=>{})}

    // ─── INIT ──────────────────────────────────────────
    const icon=document.getElementById('appleTouchIcon');if(icon)icon.href=localStorage.dsDark==="1"?"assets/distrito-angel-blue-v1.png":"assets/distrito-angel-white.png";
    token ? boot().catch(()=>{localStorage.removeItem("dsToken");token="";renderLogin()}) : renderLogin();
  </script>
