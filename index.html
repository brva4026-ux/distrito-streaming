    function updateBuyTotal(price){
      const qty=Number($("#buyQty")?.value||1), total=qty*price, bal=Number(state.user?.balance||0);
      $("#buyTotal").textContent=money(total);
      if($("#buyTotalLarge")) $("#buyTotalLarge").textContent=money(total);
      if($("#buyQtyLabel")) $("#buyQtyLabel").textContent=`${qty} pantalla${qty>1?"s":""}`;
      const ok=bal>=total || isAdmin();
      const el=$("#buyState");
      if(ok){el.style.background="rgba(18,164,84,.08)";el.style.color="#166534";el.style.border="1px solid rgba(18,164,84,.2)";el.innerHTML=`<span style="display:inline-block;margin-right:4px">&#10003;</span> Listo para comprar ${qty} pantalla${qty>1?"s":""}.`}
      else{el.style.background="rgba(239,68,68,.08)";el.style.color="#991b1b";el.style.border="1px solid rgba(239,68,68,.2)";el.innerHTML=`<span style="display:inline-block;margin-right:4px">&#9888;</span> Saldo insuficiente. Faltan ${money(total-bal)}.`}
    }
    async function finishBuy(id){
      try{
        showLoading("Procesando compra...");
        const qty=Number($("#buyQty").value||1);
        const res=await api("buy",{method:"POST",body:JSON.stringify({product_id:id,quantity:qty})});
        const delivered = res.orders||[];
        state.orders=[...delivered,...state.orders];
        if(res.balance!==undefined) state.user.balance=res.balance;
        renderDelivery(delivered);
        await boot();
      }catch(e){toast(e.message,"bad")}
      finally{hideLoading()}
    }
    function renderDelivery(orders){
      if(!orders.length) return toast("Compra registrada, pero el proveedor no devolvio datos","bad");
      openModal(`<div class="success-pulse">OK</div><div class="dialog-head"><div><small class="muted">ENTREGA AUTOMATICA</small><h2>Datos listos</h2><p class="muted">Copia y envia al cliente. Quedara guardado en Mis compras.</p></div><button class="close" onclick="closeModal()">&times;</button></div>
      <div class="list">${orders.map(o=>`<div class="card"><b>${o.product_name}</b><div class="copy-box">${o.delivered_data||"Sin datos entregados"}</div><p class="mini">Vence ${o.expires_at||"-"}</p><div class="row-actions"><button class="primary" onclick="copyText(decodeOrderMessage('${safeOrder(o)}','compra'))">${icons.copy} Copiar mensaje</button><button class="ghost" onclick="openReport('${o.id}')">Reportar</button></div></div>`).join("")}</div>`);
    }

    // ─── ORDENES ───────────────────────────────────────
    function deliveryMessageById(id,kind){const o=state.orders.find(x=>x.id===id)||{};return formatOrderMessage(o,kind)}
    function activeOrders(){
      return state.orders.filter(o=>{
        const left=daysLeft(o.expires_at);
        const status=String(o.status||"").toLowerCase();
        return left===null || left>=0 || status.includes("pend") || status.includes("proces");
      });
    }
    function orders(){
      const rows=activeOrders();
      return `<section class="card">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
          <div><h2>Mis compras</h2><p class="muted">Las vencidas finalizadas se archivan automaticamente.</p></div>
          <span class="tag">${rows.length} activas</span>
        </div>
        <div class="ops-toolbar">
          <input id="orderSearch" oninput="filterOrders()" placeholder="Buscar pedido, producto, cliente o cuenta">
          <select id="orderScope" onchange="filterOrders()"><option value="active">Activas</option><option value="all">Todas</option><option value="expired">Vencidas</option></select>
          <button class="ghost" onclick="exportOrdersCsv()">Exportar</button>
        </div>
        <div id="ordersList" class="list section">${orderRows(rows,false)}</div>
      </section>`;
    }
    function filterOrders(){
      const q=($("#orderSearch")?.value||"").toLowerCase(), scope=$("#orderScope")?.value||"active";
      let rows=scope==="all"?state.orders:scope==="expired"?state.orders.filter(o=>daysLeft(o.expires_at)<0):activeOrders();
      rows=rows.filter(o=>`${o.code} ${o.product_name} ${o.client_name} ${o.delivered_data}`.toLowerCase().includes(q));
      $("#ordersList").innerHTML=orderRows(rows,false);
    }
    function orderRows(rows,compact){
      if(!rows.length) return `<p class="muted">Sin registros todavia.</p>`;
      if(compact) {
        return rows.map(o=>{
          const left=daysLeft(o.expires_at), warning=left!==null && left<=5;
          return `<div class="list-row compact-order">
            <div><b>${o.code||"Orden"}</b></div>
            <div><b>${o.product_name}</b><br><span class="muted">${o.client_name||"Cliente"}</span></div>
            <div class="row-actions">
              <span class="tag ${warning?"bad":""}">${o.status||"Entregado"}${left!==null?` - ${left}d`: ""}</span>
              <button class="ghost" onclick="copyText(decodeOrderMessage('${safeOrder(o)}','datos'))">${icons.copy}</button>
            </div>
          </div>`;
        }).join("");
      }
      const serviceIcons = {netflix:"N",prime:"P",max:"M",disney:"D",spotify:"S",youtube:"Y",other:"O"};
      const serviceColors = {netflix:"#ef1437",prime:"#00b8ff",max:"#0877ff",disney:"#0a74ff",spotify:"#1db954",youtube:"#ff0033",other:"#7aa6c8"};
      const serviceLogos = {
        netflix:`<div style="width:24px;height:24px;background:#E50914;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff">N</div>`,
        spotify:`<div style="width:24px;height:24px;background:#1DB954;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px">♫</div>`,
        max:`<div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff">max</div>`,
        prime:`<div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#00A8E1">PV</div>`,
        disney:`<div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff">D+</div>`,
        youtube:`<div style="width:24px;height:24px;background:#FF0000;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff">▶</div>`,
        other:`<div style="width:24px;height:24px;background:#7AA6C8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff">?</div>`
      };
      return `<div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>Producto</th><th>Usuario</th><th>Fecha</th><th>Monto</th><th>Estado</th><th>Accion</th></tr></thead>
        <tbody>${rows.map(o=>{
          const left=daysLeft(o.expires_at);
          const cls=serviceClass(o.product_name);
          const icon=serviceIcons[cls]||"O";
          const color=serviceColors[cls]||"#7aa6c8";
          const logo=serviceLogos[cls]||serviceLogos.other;
          const statusClass=(o.status||"").includes("Pend")?"pending":(o.status||"").includes("Fall")?"failed":"completed";
          const statusText=o.status||"Entregado";
          return `<tr>
            <td><span class="op-id">${o.code||"#DS-0000"}</span></td>
            <td><div class="op-product"><div class="op-product-icon" style="background:${color}">${logo}</div><div><div class="op-product-name">${o.product_name}</div><div class="op-product-sub">${left!==null?left+" dias restantes":"Sin fecha"}</div></div></div></td>
            <td><div class="op-user">${icons.users}<span>${o.client_name||"-"}</span></div></td>
            <td><div class="op-date">${icons.bell}<span>${o.expires_at||"-"}</span></div></td>
            <td><span class="op-amount">${money(o.amount||o.total||0)}</span></td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td><button class="op-action" onclick="copyText(decodeOrderMessage('${safeOrder(o)}','datos'))" title="Copiar datos">${icons.copy}</button></td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>`;
    }
    function parseAccount(text){
      const parts=String(text||"").split(":").map(x=>x.trim()).filter(Boolean);
      return {email:parts[0]||"",password:parts[1]||"",profile:(parts.find(x=>/^P\d+/i.test(x))||parts[2]||""),pin:(parts.find(x=>/\d{4}/.test(x))||parts[3]||"")};
    }
    function safeOrder(o){return encodeURIComponent(JSON.stringify({product_name:o.product_name,delivered_data:o.delivered_data,expires_at:o.expires_at}))}
    function decodeOrderMessage(encoded,kind){try{return formatOrderMessage(JSON.parse(decodeURIComponent(encoded)),kind)}catch{return ""}}
    function exportOrdersCsv(){
      const rows=state.orders.map(o=>[o.code,o.product_name,o.client_name,o.status,o.expires_at,o.delivered_data].map(csvCell).join(";")).join("\n");
      downloadFile("distrito-compras.csv","\ufeffCodigo;Producto;Cliente;Estado;Vencimiento;Datos\n"+rows);
    }
    function csvCell(v){return `"${String(v??"").replaceAll('"','""')}"`}
    function downloadFile(name,content){
      const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([content],{type:"text/csv;charset=utf-8"})); a.download=name; a.click(); URL.revokeObjectURL(a.href);
    }

    // ─── HISTORIAL DE MOVIMIENTOS ──────────────────────
    function history(){
      const movements = [];

      // Agregar recargas (créditos)
      state.topups.forEach(t => {
        if(t.status === "Aprobada") {
          movements.push({
            date: t.created_at || t.approved_at || "",
            amount: Number(t.amount || 0),
            type: "crédito",
            description: `Recarga ${t.method || "Nequi/Wompi"}`,
            icon: "💰",
            color: "#16a34a"
          });
        }
      });

      // Agregar compras (débitos)
      state.orders.forEach(o => {
        movements.push({
          date: o.created_at || o.expires_at || "",
          amount: -(Number(o.amount || o.total || 0)),
          type: "débito",
          description: `Compra de: ${o.product_name || "Producto"}`,
          icon: "🛒",
          color: "#ef4444"
        });
      });

      // Ordenar por fecha (más reciente primero)
      movements.sort((a,b) => (b.date || "").localeCompare(a.date || ""));

      // Calcular totales
      const totalCredito = movements.filter(m => m.amount > 0).reduce((s,m) => s + m.amount, 0);
      const totalDebito = movements.filter(m => m.amount < 0).reduce((s,m) => s + Math.abs(m.amount), 0);
      const balance = totalCredito - totalDebito;

      return `
        <div class="card" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
            <div style="display:flex;align-items:center;gap:12px">
              <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center">
                ${icons.history}
              </div>
              <div>
                <h2 style="margin:0;font-size:18px">Historial de Movimientos</h2>
                <p class="muted" style="margin:2px 0 0;font-size:12px">${state.user?.name || "Usuario"}</p>
              </div>
            </div>
            <button class="ghost" onclick="exportHistoryCsv()">Exportar</button>
          </div>
        </div>

        <!-- Resumen -->
        <div class="grid metrics" style="margin-bottom:16px">
          <div class="card metric">
            <div style="width:40px;height:40px;border-radius:10px;background:rgba(22,163,74,.1);display:grid;place-items:center">
              <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" width="20" height="20"><path d="M12 5v14M5 12h14"/></svg>
            </div>
            <div>
              <span class="muted" style="font-size:11px">Total Recargas</span>
              <br><b style="color:#16a34a">$${totalCredito.toLocaleString("es-CO")}</b>
            </div>
          </div>
          <div class="card metric">
            <div style="width:40px;height:40px;border-radius:10px;background:rgba(239,68,68,.1);display:grid;place-items:center">
              <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" width="20" height="20"><path d="M5 12h14"/></svg>
            </div>
            <div>
              <span class="muted" style="font-size:11px">Total Compras</span>
              <br><b style="color:#ef4444">$${totalDebito.toLocaleString("es-CO")}</b>
            </div>
          </div>
          <div class="card metric">
            <div style="width:40px;height:40px;border-radius:10px;background:rgba(8,119,255,.1);display:grid;place-items:center">
              ${icons.wallet}
            </div>
            <div>
              <span class="muted" style="font-size:11px">Saldo Actual</span>
              <br><b style="color:var(--blue)">${money(state.user?.balance || 0)}</b>
            </div>
          </div>
          <div class="card metric">
            <div style="width:40px;height:40px;border-radius:10px;background:rgba(124,58,237,.1);display:grid;place-items:center">
              <svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" width="20" height="20"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div>
              <span class="muted" style="font-size:11px">Movimientos</span>
              <br><b style="color:#7c3aed">${movements.length}</b>
            </div>
          </div>
        </div>

        <!-- Tabla de movimientos -->
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
            <div><h2 style="margin:0;font-size:16px">Detalle de Movimientos</h2><p class="muted" style="margin:2px 0 0;font-size:12px">Créditos y débitos de tu cuenta</p></div>
          </div>
          <div style="overflow-x:auto">
            <table class="expiring-table">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Monto</th>
                  <th>Tipo</th>
                  <th>Descripción</th>
                </tr>
              </thead>
              <tbody>
                ${movements.length ? movements.map(m => `
                  <tr>
                    <td style="font-size:12px;white-space:nowrap">${m.date || "-"}</td>
                    <td style="font-weight:800;color:${m.color}">${m.amount > 0 ? "+" : ""}$${Math.abs(m.amount).toLocaleString("es-CO")}</td>
                    <td>
                      <span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:800;background:${m.type === "crédito" ? "rgba(22,163,74,.1)" : "rgba(239,68,68,.1)"};color:${m.color}">
                        ${m.icon} ${m.type === "crédito" ? "Crédito" : "Débito"}
                      </span>
                    </td>
                    <td style="font-size:13px">${m.description}</td>
                  </tr>
                `).join("") : `
                  <tr>
                    <td colspan="4" style="text-align:center;color:var(--muted);padding:32px">
                      <div style="font-size:32px;margin-bottom:8px">📊</div>
                      <b>Sin movimientos</b><br>
                      <span style="font-size:12px">Tus recargas y compras aparecerán aquí</span>
                    </td>
                  </tr>
                `}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function exportHistoryCsv(){
      const movements = [];
      state.topups.forEach(t => {
        if(t.status === "Aprobada") {
          movements.push([t.created_at || "", `$${Number(t.amount||0).toLocaleString("es-CO")}`, "Crédito", `Recarga ${t.method||"Nequi/Wompi"}`]);
        }
      });
      state.orders.forEach(o => {
        movements.push([o.created_at || "", `-$${Number(o.amount||o.total||0).toLocaleString("es-CO")}`, "Débito", `Compra: ${o.product_name||"Producto"}`]);
      });
      movements.sort((a,b) => (b[0]||"").localeCompare(a[0]||""));
      const rows = movements.map(m => m.map(v => `"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");
      downloadFile("distrito-movimientos.csv", "\ufeffFecha;Monto;Tipo;Descripción\n" + rows);
      toast("Historial exportado", "ok");
    }

    // ─── REPORTES ──────────────────────────────────────
    function reports(){
      const filters=["Todos","Caida total","PIN / Perfil","En revision","Resuelto"];
      const open=state.reports.filter(r=>r.status!=="Resuelto").length, solved=state.reports.filter(r=>r.status==="Resuelto").length;
      return `<section class="grid split">
        <div class="card"><h2>Reportes</h2><p class="muted">Seguimiento: recibido, proveedor, revision y solucion.</p>
          <div class="report-status"><div class="status-chip"><b>${state.reports.length}</b>Total</div><div class="status-chip"><b>${open}</b>Abiertos</div><div class="status-chip"><b>${solved}</b>Resueltos</div><div class="status-chip"><b>${state.reports.filter(r=>String(r.reason).includes("Caida")).length}</b>Caidas</div></div>
          <div class="row-actions">${filters.map(f=>`<button class="ghost" onclick="filterReports('${f}')">${f}</button>`).join("")}</div>
          <div id="reportList" class="list section">${reportRows(state.reports)}</div>
        </div>
        <div class="card"><h2>Nuevo reporte</h2><p class="muted">Elige compra, motivo y descripcion.</p><button class="primary" onclick="openReport()">Reportar problema</button>${isAdmin()?`<button class="ghost section" onclick="exportReportsCsv()">Exportar</button>`:""}</div>
      </section>`;
    }
    function reportRows(rows){
      if(!rows.length) return `<p class="muted">Sin reportes.</p>`;
      return rows.map(r=>`<div class="list-row"><div><b>${r.code||"Reporte"} - ${r.product_name||"Producto"}</b><br><span>${r.reason||"Sin motivo"}</span><p class="mini">${r.description||""}</p>${r.provider_response?`<div class="copy-box">${r.provider_response}</div>`:""}</div><div class="row-actions"><span class="tag ${r.status==="Resuelto"?"":r.status==="Rechazado"?"bad":"warn"}">${r.status||"En revision"}</span>${r.provider_response?`<button class="ghost" onclick="copyText('${escapeJs(r.provider_response)}')">Copiar</button>`:""}${isAdmin()?`<button class="ghost" onclick="resolveReport('${r.id}','Resuelto')" style="color:#10b981" title="Marcar resuelto">&#10003;</button><button class="danger-btn" onclick="deleteReport('${r.id}')">Cerrar</button>`:""}</div></div>`).join("");
    }
    function filterReports(filter){
      const rows=filter==="Todos"?state.reports:state.reports.filter(r=>String(r.status).includes(filter)||String(r.reason).includes(filter));
      $("#reportList").innerHTML=reportRows(rows);
    }
    function openReport(orderId=""){
      if(!state.orders.length) return openModal(`<div class="dialog-head"><div><small class="muted">SOPORTE</small><h2>No hay compras para reportar</h2></div><button class="close" onclick="closeModal()">&times;</button></div><button class="primary" onclick="closeModal();setView('store')">Ir a tienda</button>`);
      const o=state.orders.find(x=>x.id===orderId) || state.orders[0] || {};
      openModal(`<div class="dialog-head"><div><small class="muted">SOPORTE</small><h2>Reportar fallo</h2></div><button class="close" onclick="closeModal()">&times;</button></div>
        <div class="form">
          <label>Cuenta o compra<select id="rpOrder">${state.orders.map(x=>`<option value="${x.id}" ${x.id===o.id?"selected":""}>${x.product_name} - ${(x.delivered_data||"").slice(0,32)}</option>`).join("")}</select></label>
          <label>Motivo<select id="rpReason"><option>Caida total</option><option>PIN / Perfil</option><option>Contrasena incorrecta</option><option>Cuenta sin plan</option><option>Cuenta no encontrada</option><option>Limite de dispositivos</option><option>Renovacion</option></select></label>
          <label>Descripcion<textarea id="rpDesc" placeholder="Describe el problema exacto."></textarea></label>
          <button class="primary" onclick="sendReport()">Enviar reporte</button>
        </div>`);
    }
    async function sendReport(){
      try{
        showLoading("Enviando reporte...");
        const order_id=$("#rpOrder").value, o=state.orders.find(x=>x.id===order_id)||{};
        await api("reports",{method:"POST",body:JSON.stringify({order_id,product_name:o.product_name,account_data:o.delivered_data,reason:$("#rpReason").value,description:$("#rpDesc").value})});
        closeModal(); toast("Reporte enviado","ok"); await boot();
      }catch(e){toast(e.message,"bad")}
      finally{hideLoading()}
    }
    async function deleteReport(id){try{showLoading("Cerrando...");await api("reports?id="+id,{method:"DELETE"});toast("Reporte cerrado","ok");await boot()}catch(e){toast(e.message,"bad")}finally{hideLoading()}}
    async function resolveReport(id,status){try{showLoading("Actualizando...");await api("reports",{method:"PATCH",body:JSON.stringify({id,status})});toast("Reporte actualizado","ok");await boot()}catch(e){toast(e.message,"bad")}finally{hideLoading()}}
    function exportReportsCsv(){
      const rows=state.reports.map(r=>[r.code,r.product_name,r.reason,r.status,r.description,r.provider_response].map(csvCell).join(";")).join("\n");
      downloadFile("distrito-reportes.csv","\ufeffCodigo;Producto;Motivo;Estado;Descripcion;Respuesta\n"+rows);
    }

    // ─── PUBLICIDAD ────────────────────────────────────
    function ads(){
      return `<section class="grid ${isAdmin()?"split":""}">
        <div class="card"><h2>${isAdmin()?"Campanas publicadas":"Material disponible"}</h2><p class="muted">${isAdmin()?"Sube imagenes o archivos para que los usuarios copien y usen.":"Copia y descarga el material activo."}</p><div class="grid store-grid section">${state.ads.map(adCard).join("") || "<p class='muted'>No hay material publicado.</p>"}</div></div>
        ${isAdmin()?`<div class="card"><h2>Subir material</h2><p class="muted">Sube una imagen o archivo. El usuario podra copiar el texto y descargar el archivo.</p>
          <div class="form">
            <label>Titulo<input id="adTitle" placeholder="Ej: Promo Netflix Lunes"></label>
            <label>Texto para copiar<textarea id="adCopy" placeholder="Mensaje que el usuario copiara."></textarea></label>
            <label>Precio sugerido (opcional)<input id="adPrice" placeholder="$ 15.000"></label>
            <label>Archivo / Imagen<input id="adFile" type="file" accept="image/*,.pdf,.doc,.docx" onchange="previewAdFile()"></label>
            <div id="adPreview" class="copy-box muted" style="min-height:60px">Sin archivo seleccionado.</div>
            <button class="primary" onclick="createAd()">Publicar material</button>
          </div>
        </div>`:""}
      </section>`;
    }
    function adCard(a){
      const hasFile = a.file_url || a.file_name;
      return `<article class="card product">
        <div class="poster other"><span class="shine"></span><span class="svc">DISTRITO</span><div class="logo-word">${a.title}</div></div>
        <div class="product-body">
          <h3>${a.title}</h3>
          <p class="mini">${a.short_text||a.copy_text||""}</p>
          <div class="row-actions">
            <button class="primary" onclick="copyText('${escapeJs(a.copy_text||a.short_text||"")}')">${icons.copy} Copiar</button>
            ${hasFile?`<button class="ghost" onclick="downloadAdFile('${escapeJs(a.file_url||"")}','${escapeJs(a.file_name||"archivo")}')">${icons.download} Descargar</button>`:""}
            ${isAdmin()?`<button class="danger-btn" onclick="deleteAd('${a.id}')">Eliminar</button>`:""}
          </div>
        </div>
      </article>`;
    }
    async function createAd(){
      try{
        showLoading("Publicando material...");
        const file=$("#adFile").files[0];
        const copy=[$("#adCopy").value,$("#adPrice").value?`Precio: ${$("#adPrice").value}`:"",file?`Archivo: ${file.name}`:""].filter(Boolean).join("\n");
        await api("ads",{method:"POST",body:JSON.stringify({title:$("#adTitle").value,short_text:$("#adCopy").value.slice(0,80),copy_text:copy,status:"Activa",file_name:file?.name||"",file_url:file?URL.createObjectURL(file):""})});
        toast("Material publicado","ok"); await boot();
      }catch(e){toast(e.message,"bad")}
      finally{hideLoading()}
    }
    function previewAdFile(){
      const file=$("#adFile").files[0], box=$("#adPreview");
      if(!file){box.textContent="Sin archivo seleccionado.";box.className="copy-box muted";return}
      if(file.type.startsWith("image/")){
        const url=URL.createObjectURL(file);
        box.innerHTML=`<b>${file.name}</b> <span class="muted">(${(file.size/1024).toFixed(0)} KB)</span><br><img src="${url}" style="max-width:100%;border-radius:10px;margin-top:6px">`;

    function payments(){
      const pending=state.topups.filter(t=>t.status==="Pendiente");
      const totalApproved = state.topups.filter(t=>t.status==="Aprobada").reduce((s,t)=>s+Number(t.amount||0),0);
      const totalProfit = state.topups.filter(t=>t.status==="Aprobada").reduce((s,t)=>s+profitFromRecharge(Number(t.amount||0)),0);
      return `<section class="grid metrics">
        ${metric("Pendientes",pending.length,icons.payments)}
        ${metric("Aprobadas",state.topups.filter(t=>t.status==="Aprobada").length,icons.wallet)}
        ${metric("Total recibido",money(totalApproved),icons.orders)}
        ${metric("Ganancia 20%",money(totalProfit),icons.chart)}
      </section>
      <section class="grid split section">
        <div class="card"><h2>Recargas por aprobar</h2><p class="muted">Aprueba cuando confirmes el pago en Nequi/Wompi.</p><div class="list section">${state.topups.map(topupRow).join("")||"<p class='muted'>Sin solicitudes.</p>"}</div></div>
        <div class="card"><h2>Datos de pago</h2><div class="pay-card"><img src="${ASSETS}nequi-negocios-qr.jpeg" alt="QR Nequi"><div><b>Distrito Streaming</b><p>Numero: ${PAYMENT_NUMBER}</p><a target="_blank" href="${PAYMENT_LINK}">Abrir link Wompi</a><br><button class="ghost section" onclick="copyText('${PAYMENT_NUMBER}')">Copiar numero</button></div></div></div>
      </section>`;
    }
    function topupRow(t){
      const profit = profitFromRecharge(Number(t.amount||0));
      return `<div class="list-row"><div><b>${money(t.amount)} - ${t.method||"Nequi"}</b><p class="mini">${t.reference||"Sin referencia"}${isAdmin()?` | Ganancia: ${money(profit)}`:""}</p></div><div class="row-actions"><span class="tag ${t.status==="Pendiente"?"warn":t.status==="Rechazada"?"bad":""}">${t.status}</span>${t.status==="Pendiente"&&isAdmin()?`<button class="ok-btn" onclick="approveTopup('${t.id}')">Aprobar</button><button class="danger-btn" onclick="rejectTopup('${t.id}')">Rechazar</button>`:""}</div></div>`;
    }
    async function approveTopup(id){
      try{showLoading("Aprobando...");await api("topups",{method:"PATCH",body:JSON.stringify({id,status:"Aprobada"})});toast("Saldo aprobado","ok");await boot()}catch(e){toast(e.message,"bad")}finally{hideLoading()}

    async function rejectTopup(id){
      try{showLoading("Rechazando...");await api("topups",{method:"PATCH",body:JSON.stringify({id,status:"Rechazada"})});toast("Recarga rechazada","ok");await boot()}catch(e){toast(e.message,"bad")}finally{hideLoading()}

    function updateAutoTotal(){

      const commission = Math.round(amount * 0.05);
      const total = amount + commission;
      document.getElementById('autoValor').textContent = amount > 0 ? '$' + amount.toLocaleString('es-CO') : '-';

      document.getElementById('autoTotal').textContent = amount > 0 ? '$' + total.toLocaleString('es-CO') : '-';

    function setQuickAmount(amount, btn){

    function sendWhatsApp(){
      const amount = document.getElementById("tpAmountManual")?.value;
      if(!amount || amount < 1000) return toast("Selecciona o escribe un monto válido","bad");

      const userName = state.user?.name || "Usuario";
      const userEmail = state.user?.email || "";
      const date = new Date().toLocaleDateString("es-CO");
      const time = new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
      const formattedAmount = "$" + Number(amount).toLocaleString("es-CO");

      let msg = `💰 *SOLICITUD DE RECARGA*\\n`;
      msg += `━━━━━━━━━━━━━━━━\\n`;
      msg += `👤 *Cliente:* ${userName}\\n`;
      msg += `📧 *Email:* ${userEmail}\\n`;
      msg += `💵 *Monto:* ${formattedAmount} COP\\n`;
      msg += `📅 *Fecha:* ${date} - ${time}\\n`;
      msg += `━━━━━━━━━━━━━━━━\\n`;
      msg += `Espero datos para realizar el pago. Gracias!`;

      window.open(`${WHATSAPP_LINK}?text=${encodeURIComponent(msg)}`, "_blank");

      const refText = `${userName} - ${formattedAmount}`;
      api("topups",{method:"POST",body:JSON.stringify({amount:Number(amount),method:"WhatsApp",reference:refText})})
        .then(()=>{ toast("Solicitud enviada. Espera datos de pago por WhatsApp.","ok"); closeModal(); })
        .catch(()=>{ toast("Solicitud registrada. Confirma por WhatsApp.","ok"); closeModal(); });
    }

    function payWithWompi(){
      const amount = document.getElementById("tpAmountAuto")?.value || "50000";
      window.open(`${PAYMENT_LINK}?amount=${amount}`, "_blank");
      toast("Redirigiendo a Wompi...","ok");

    // ─── ESTUDIO GENERAL (ANALYTICS) ───────────────────
    function analytics(){
      const totalRevenue = state.orders.reduce((s,o)=>s+Number(o.amount||o.total||0),0);
      const totalTopups = state.topups.filter(t=>t.status==="Aprobada").reduce((s,t)=>s+Number(t.amount||0),0);
      const totalProfit = state.topups.filter(t=>t.status==="Aprobada").reduce((s,t)=>s+profitFromRecharge(Number(t.amount||0)),0);
      const pendingTopups = state.topups.filter(t=>t.status==="Pendiente");
      const openReports = state.reports.filter(r=>r.status!=="Resuelto");
      const closedReports = state.reports.filter(r=>r.status==="Resuelto");
      const activeUsers = state.users.filter(u=>(u.status||"Activo")==="Activo");
      const resellers = state.users.filter(u=>u.role==="Revendedor");
      const clients = state.users.filter(u=>u.role==="Cliente");
      const totalSales = state.orders.length;
      const avgTicket = totalSales > 0 ? Math.round(totalRevenue / totalSales) : 0;

      const productStats = {};
      state.orders.forEach(o => {
        const name = o.product_name || "Desconocido";
        if(!productStats[name]) productStats[name] = { count:0, revenue:0 };
        productStats[name].count++;
        productStats[name].revenue += Number(o.amount||o.total||0);
      });
      const topProducts = Object.entries(productStats).sort((a,b)=>b[1].count-a[1].count).slice(0,5);

      const expiringSoon = state.orders.filter(o => {
        const left = daysLeft(o.expires_at);
        return left !== null && left >= 0 && left <= 7;
      });

      return `
        <section class="grid metrics">
          ${metric("Ingresos totales",money(totalRevenue),icons.wallet)}
          ${metric("Recargas recibidas",money(totalTopups),icons.payments)}
          ${metric("Ganancia neta (20%)",money(totalProfit),icons.chart)}
          ${metric("Ticket promedio",money(avgTicket),icons.store)}
        </section>

        <section class="grid split section">
          <div class="card">
            <h2>Resumen de operacion</h2>
            <p class="muted">Estudio general del negocio.</p>
            <div class="analytics-card" style="margin-top:10px">
              <div class="analytics-row"><span class="muted">Total ventas</span><b>${totalSales}</b></div>
              <div class="analytics-row"><span class="muted">Usuarios activos</span><b>${activeUsers.length}</b></div>
              <div class="analytics-row"><span class="muted">Revendedores</span><b>${resellers.length}</b></div>
              <div class="analytics-row"><span class="muted">Clientes</span><b>${clients.length}</b></div>
              <div class="analytics-row"><span class="muted">Compras activas</span><b>${activeOrders().length}</b></div>
              <div class="analytics-row"><span class="muted">Pantallas con limite de operador</span><b>${state.products.filter(p=>p.shared===false||String(p.share_type||"").toLowerCase()==="personal").length}</b></div>
              <div class="analytics-row"><span class="muted">Pagos pendientes</span><b style="color:var(--warn)">${pendingTopups.length}</b></div>
              <div class="analytics-row"><span class="muted">Reportes abiertos</span><b style="color:var(--bad)">${openReports.length}</b></div>
              <div class="analytics-row"><span class="muted">Reportes resueltos</span><b style="color:var(--ok)">${closedReports.length}</b></div>
            </div>
          </div>

          <div class="card">
            <h2>Productos mas vendidos</h2>
            <p class="muted">Top 5 por cantidad de ventas.</p>
            <div class="analytics-card" style="margin-top:10px">
              ${topProducts.length?topProducts.map(([name,stat])=>`
                <div class="analytics-row"><div><b>${name}</b><br><span class="mini">${stat.count} ventas</span></div><b>${money(stat.revenue)}</b></div>
              `).join(""):`<p class="muted">Sin datos de ventas aun.</p>`}
            </div>
          </div>
        </section>

        ${expiringSoon.length?`
        <section class="card section">
          <h2>Por vencer (7 dias)</h2>
          <p class="muted">Cuentas que vencen pronto. Considera contactar a los clientes.</p>
          <div class="list section">${expiringSoon.map(o=>{
            const left=daysLeft(o.expires_at);
            return `<div class="list-row"><div><b>${o.product_name}</b><br><span class="muted">${o.client_name||"Cliente"} - ${o.delivered_data||"-"}</span></div><div class="row-actions"><span class="tag bad">${left} dias</span><button class="ghost" onclick="copyText(decodeOrderMessage('${safeOrder(o)}','renovar'))">${icons.copy} Mensaje renovar</button></div></div>`;
          }).join("")}</div>
        </section>`:""}

        <section class="card section">
          <h2>Recomendaciones</h2>
          <p class="muted">Sugerencias automaticas basadas en el estado actual.</p>
          <div class="list section">
            ${pendingTopups.length>3?`<div class="alert-card danger"><b>${pendingTopups.length} recargas pendientes</b> - Revisa y aprueba lo mas pronto para mantener el flujo.</div>`:""}
            ${openReports.length>2?`<div class="alert-card"><b>${openReports.length} reportes abiertos</b> - Intenta resolver los reportes viejos primero.</div>`:""}
            ${!isAdmin()&&Number(state.user?.balance||0)<20000?`<div class="alert-card danger"><b>Saldo bajo</b> - Tu saldo es ${money(state.user?.balance||0)}. Recarga para seguir vendiendo.</div>`:""}
            ${expiringSoon.length>0?`<div class="alert-card info"><b>${expiringSoon.length} cuentas por vencer</b> - Envia mensajes de renovacion a los clientes.</div>`:""}
            ${resellers.length===0?`<div class="alert-card info"><b>Sin revendedores</b> - Crea revendedores para ampliar tu red de ventas.</div>`:""}
            <div class="alert-card info"><b>Control de pantallas personales</b> - Spotify y servicios personales solo permiten 1 operador. Asegurate de configurar esto en el inventario.</div>
          </div>
        </section>`;
    }

          <button onclick="closeModal();openTopup()" style="width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#0877ff,#0057dc);color:#fff;font-weight:800;font-size:13px;cursor:pointer;transition:all .2s;box-shadow:0 6px 20px rgba(8,119,255,.25)" onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 8px 24px rgba(8,119,255,.35)'" onmouseout="this.style.transform='';this.style.boxShadow='0 6px 20px rgba(8,119,255,.25)'">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="16" height="16" style="vertical-align:middle;margin-right:6px"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            Recargar Saldo
          </button>
        </div>`:""}
        <div style="display:grid;gap:10px;margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:12px">
            <div style="width:40px;height:40px;border-radius:10px;background:rgba(8,119,255,.1);display:grid;place-items:center;flex-shrink:0">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" width="20" height="20"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Telefono</div>
              <div style="font-size:14px;font-weight:700;color:var(--text)">${u.phone||"3102765347"}</div>
            </div>
            <button onclick="copyText('${u.phone||"3102765347"}')" style="padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--blue);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='rgba(8,119,255,.3)'" onmouseout="this.style.borderColor='var(--line)'">Copiar</button>
          </div>
          <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:12px">
            <div style="width:40px;height:40px;border-radius:10px;background:rgba(16,185,129,.1);display:grid;place-items:center;flex-shrink:0">
              <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" width="20" height="20"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Ubicacion</div>
              <div style="font-size:14px;font-weight:700;color:var(--text)">Bogota, Colombia</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:12px">
            <div style="width:40px;height:40px;border-radius:10px;background:${roleBg};display:grid;place-items:center;flex-shrink:0">
              <svg viewBox="0 0 24 24" fill="none" stroke="${roleColor}" stroke-width="2" width="20" height="20"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Estado</div>
              <div style="font-size:14px;font-weight:700;color:${roleColor}">${u.status||"Activo"}</div>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <button onclick="toggleDark()" style="flex:1;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-weight:800;font-size:13px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:8px" onmouseover="this.style.borderColor='rgba(8,119,255,.3)'" onmouseout="this.style.borderColor='var(--line)'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 3a6 6 0 0 0 9 7.5A9 9 0 1 1 12 3Z"/></svg>
            Cambiar tema
          </button>
          <button onclick="logout()" style="flex:1;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-weight:800;font-size:13px;cursor:pointer;transition:all .2s;box-shadow:0 6px 20px rgba(239,68,68,.25);display:flex;align-items:center;justify-content:center;gap:8px" onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 8px 24px rgba(239,68,68,.35)'" onmouseout="this.style.transform='';this.style.boxShadow='0 6px 20px rgba(239,68,68,.25)'">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Cerrar sesion
          </button>
        </div>`);
    }
    function toggleDark(){localStorage.dsDark=localStorage.dsDark==="1"?"0":"1";renderApp()}
    function toggleAlerts(ev){
      ev?.stopPropagation();
      const panel=$("#alerts"), unread=state.notifications.filter(n=>!n.read_at).length;
      panel.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>Notificaciones</b><span class="notice-dot">${unread}</span></div><div class="list">${state.notifications.map(n=>`<div class="list-row" style="padding:10px"><div><b style="font-size:13px">${n.title}</b><p class="mini">${n.body||""}</p></div></div>`).join("")||"<p class='muted'>Sin avisos.</p>"}</div>`;
      panel.classList.toggle("show");
    }
    function toggleUserMenu(ev){
      ev?.stopPropagation();
      const dd=$("#userDropdown");
      if(dd) dd.classList.toggle("show");
    }
    function openQrCode(){
      const u=state.user;
      openModal(`<div class="dialog-head"><div><small class="muted">MI QR</small><h2>Codigo QR personal</h2><p class="muted">Comparte este codigo para que te identifiquen.</p></div><button class="close" onclick="closeModal()">&times;</button></div>
        <div style="text-align:center;padding:20px">
          <div style="width:180px;height:180px;margin:0 auto 16px;background:#fff;border-radius:16px;display:grid;place-items:center;border:2px solid var(--line)">
            <svg viewBox="0 0 100 100" width="140" height="140"><rect x="5" y="5" width="30" height="30" rx="4" fill="#111"/><rect x="10" y="10" width="20" height="20" rx="2" fill="#fff"/><rect x="14" y="14" width="12" height="12" rx="1" fill="#111"/><rect x="65" y="5" width="30" height="30" rx="4" fill="#111"/><rect x="70" y="10" width="20" height="20" rx="2" fill="#fff"/><rect x="74" y="14" width="12" height="12" rx="1" fill="#111"/><rect x="5" y="65" width="30" height="30" rx="4" fill="#111"/><rect x="10" y="70" width="20" height="20" rx="2" fill="#fff"/><rect x="14" y="74" width="12" height="12" rx="1" fill="#111"/><rect x="40" y="5" width="8" height="8" fill="#111"/><rect x="52" y="5" width="8" height="8" fill="#111"/><rect x="40" y="18" width="8" height="8" fill="#111"/><rect x="40" y="40" width="8" height="8" fill="#111"/><rect x="52" y="40" width="8" height="8" fill="#111"/><rect x="65" y="40" width="8" height="8" fill="#111"/><rect x="78" y="40" width="8" height="8" fill="#111"/><rect x="40" y="52" width="8" height="8" fill="#111"/><rect x="52" y="52" width="8" height="8" fill="#111"/><rect x="65" y="52" width="8" height="8" fill="#111"/><rect x="78" y="52" width="8" height="8" fill="#111"/><rect x="5" y="40" width="8" height="8" fill="#111"/><rect x="5" y="52" width="8" height="8" fill="#111"/><rect x="18" y="40" width="8" height="8" fill="#111"/><rect x="18" y="52" width="8" height="8" fill="#111"/><rect x="52" y="65" width="8" height="8" fill="#111"/><rect x="65" y="65" width="8" height="8" fill="#111"/><rect x="78" y="65" width="8" height="8" fill="#111"/><rect x="52" y="78" width="8" height="8" fill="#111"/><rect x="65" y="78" width="8" height="8" fill="#111"/><rect x="78" y="78" width="8" height="8" fill="#111"/><rect x="40" y="65" width="8" height="8" fill="#111"/><rect x="40" y="78" width="8" height="8" fill="#111"/><rect x="5" y="78" width="8" height="8" fill="#111"/><rect x="18" y="78" width="8" height="8" fill="#111"/></svg>
          </div>
          <b style="font-size:16px">${u.name}</b><br>
          <span class="muted" style="font-size:13px">${u.email}</span><br>
          <span class="tag" style="margin-top:8px;display:inline-flex">${publicRole()}</span>
        </div>
        <button class="primary" onclick="copyText('${u.id||u.email}');closeModal()">Copiar ID</button>`);
    }
    document.addEventListener("click",e=>{
      if(!e.target.closest("#alerts")&&!e.target.closest(".pill"))$("#alerts")?.classList.remove("show");
      if(!e.target.closest(".user-avatar-btn")&&!e.target.closest(".user-dropdown"))$("#userDropdown")?.classList.remove("show");
    });
    function openModal(html){$("#alerts").classList.remove("show");$("#modal").innerHTML=`<div class="dialog">${html}</div>`;$("#modal").classList.add("show")}
    function closeModal(){$("#modal").classList.remove("show")}
    document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal()});
    function copyText(text){navigator.clipboard?.writeText(text).then(()=>toast("Copiado","ok")).catch(()=>toast("No se pudo copiar","bad"))}
    function downloadQRImage(){
      const a=document.createElement("a");
      a.href=ASSETS+"nequi-negocios-qr.jpeg";
      a.download="QR-Distrito-Streaming-Nequi.jpeg";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      toast("Imagen QR descargada","ok");
    }
    function downloadAdFile(url,name){
      if(!url){toast("No hay archivo para descargar","bad");return}
      const a=document.createElement("a");
      a.href=url;a.download=name||"archivo";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      toast("Descargando "+name+"...","ok");
    }
    async function copyQRImage(){
      try{
        const resp=await fetch(ASSETS+"nequi-negocios-qr.jpeg");
        const blob=await resp.blob();
        await navigator.clipboard.write([new ClipboardItem({"image/blob":blob})]);
        toast("Imagen QR copiada - pega donde quieras","ok");
      }catch(e){
        toast("No se pudo copiar la imagen. Intenta descargar.","bad");
      }
    }
    function escapeJs(text){return String(text||"").replaceAll("\\","\\\\").replaceAll("'","\\'").replaceAll("\n","\\n")}

    // ─── PWA ───────────────────────────────────────────
    window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(localStorage.dsPwaDismissed!=="1")document.getElementById("pwa-banner").classList.add("show")});
    function installPwa(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==="accepted")toast("App instalada","ok");deferredPrompt=null;closePwaBanner()})}
    function closePwaBanner(){document.getElementById("pwa-banner").classList.remove("show");localStorage.dsPwaDismissed="1"}
    if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister()));caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));navigator.serviceWorker.register("sw.js").catch(()=>{})}

    // ─── INIT ──────────────────────────────────────────
    token ? boot().catch(()=>{localStorage.removeItem("dsToken");token="";renderLogin()}) : renderLogin();
  </script>
</body>
</html>
