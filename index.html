<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0877ff" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Distrito Streaming - Panel de gestión de cuentas de streaming. Compra, vende y administra tus servicios." />
  <meta property="og:title" content="Distrito Streaming - Gestión de Cuentas Streaming" />
  <meta property="og:description" content="Panel de gestión para revendedores y clientes de streaming. Compra, vende y administra cuentas." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="assets/distrito-angel-white.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/distrito-angel-white.png" id="appleTouchIcon" />
  <title>Distrito Streaming - Panel de Gestión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f0f0f5;--panel:#fff;--soft:#f5f5fa;--line:#e0e0e8;--text:#1a1a2e;--muted:#6b6b80;
      --blue:#0877ff;--blue2:#0057dc;--cyan:#27c2ff;--ok:#12a454;--warn:#f59e0b;--bad:#ef4444;
      --purple:#7c3aed;--purple-light:#a78bfa;--purple-dark:#5b21b6;--purple-bg:#f5f3ff;
      --shadow:0 12px 32px rgba(8,119,255,.08);--shadow2:0 20px 56px rgba(8,119,255,.12);
      --radius:16px;--radius-sm:12px;--radius-lg:22px;
    }
    body.dark{
      --bg:#071526;--panel:#0d1d31;--soft:#12253b;--line:#1e3652;--text:#eef6ff;--muted:#8da0b8;
      --blue:#0877ff;--blue2:#0057dc;--cyan:#00d4ff;
      --shadow:0 16px 48px rgba(0,0,0,.28);--shadow2:0 24px 64px rgba(8,119,255,.12);
      color-scheme:dark
    }
    *{box-sizing:border-box;margin:0}
    ::selection{background:rgba(8,119,255,.25);color:var(--text)}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(8,119,255,.25);border-radius:999px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(8,119,255,.4)}
    body{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    button,input,select,textarea{font:inherit;border:0;-webkit-appearance:none;appearance:none}
    button{cursor:pointer;transition:all .18s ease;touch-action:manipulation}
    button:disabled{cursor:not-allowed;opacity:.5}
    a{color:var(--blue);text-decoration:none;font-weight:700;transition:color .15s}
    img{max-width:100%;display:block}
    input:focus,select:focus,textarea:focus{outline:none}
    .muted{color:var(--muted)}
    .hide{display:none!important}

    .app-bg{min-height:100vh;background:linear-gradient(110deg,rgba(255,255,255,.5),rgba(243,240,255,.6)),radial-gradient(circle at 92% 0,rgba(8,119,255,.08),transparent 32%),radial-gradient(circle at 16% 88%,rgba(8,119,255,.06),transparent 28%),var(--bg)}
    body.dark .app-bg{background:radial-gradient(circle at 90% 0,rgba(8,119,255,.14),transparent 34%),radial-gradient(circle at 12% 88%,rgba(8,119,255,.07),transparent 28%),var(--bg)}

    /* ─── DASHBOARD HOME ─── */
    .dash-grid{display:grid;grid-template-columns:1fr 320px;gap:16px}
    .dash-main{display:flex;flex-direction:column;gap:16px;min-width:0}
    .dash-side{display:flex;flex-direction:column;gap:16px}

    /* ─── CAROUSEL ─── */
    .carousel{position:relative;border-radius:var(--radius);overflow:hidden;background:#1a1035;min-height:160px}
    .carousel-track{display:flex;transition:transform .5s cubic-bezier(.4,0,.2,1)}
    .carousel-slide{min-width:100%;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative}
    .carousel-slide::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(8,119,255,.3),rgba(8,119,255,.15));pointer-events:none}
    .carousel-slide h3{font-size:22px;font-weight:1000;color:#fff;line-height:1.1;position:relative;z-index:1}
    .carousel-slide .hours{position:relative;z-index:1;text-align:right}
    .carousel-slide .hours .day{font-size:11px;color:rgba(255,255,255,.6);font-weight:700;letter-spacing:.05em}
    .carousel-slide .hours .time{font-size:16px;font-weight:1000;color:#fff;letter-spacing:.02em}
    .carousel-slide .hours .time small{font-size:11px;font-weight:600;color:rgba(255,255,255,.5);margin-left:4px}
    .carousel-nav{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
    .carousel-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);border:0;cursor:pointer;transition:all .2s}
    .carousel-dot.active{background:#fff;width:24px;border-radius:4px}
    .carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:2;transition:all .2s;backdrop-filter:blur(8px)}
    .carousel-arrow:hover{background:rgba(255,255,255,.25)}
    .carousel-arrow.prev{left:12px}
    .carousel-arrow.next{right:12px}

    /* ─── SALDO CARD ─── */
    .saldo-card{background:linear-gradient(135deg,var(--purple),var(--purple-light));border-radius:var(--radius);padding:24px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 12px 32px rgba(8,119,255,.25)}
    .saldo-card .saldo-info .saldo-label{font-size:16px;font-weight:800;margin-bottom:2px}
    .saldo-card .saldo-info .saldo-sub{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:8px}
    .saldo-card .saldo-info .saldo-amount{font-size:28px;font-weight:1000;letter-spacing:-.02em}
    .saldo-card .saldo-icon{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex-shrink:0}
    .saldo-card .saldo-icon svg{width:32px;height:32px;stroke:#fff}

    /* ─── TABLE EXPIRING ─── */
    .expiring-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
    .expiring-card .card-header{padding:18px 20px;border-bottom:1px solid var(--line)}
    .expiring-card .card-header h2{font-size:17px;font-weight:900;color:var(--purple);margin-bottom:2px}
    .expiring-card .card-header p{font-size:12px;color:var(--muted)}
    .expiring-table{width:100%;border-collapse:collapse}
    .expiring-table th{background:var(--purple);color:#fff;font-size:11px;font-weight:800;padding:10px 14px;text-align:left;text-transform:uppercase;letter-spacing:.04em}
    .expiring-table td{padding:10px 14px;font-size:12px;border-bottom:1px solid var(--line);vertical-align:middle}
    .expiring-table tr:last-child td{border-bottom:none}
    .expiring-table tr:hover{background:rgba(8,119,255,.03)}
    .expiring-table .days-warn{color:var(--bad);font-weight:900}
    .expiring-table .days-ok{color:var(--ok);font-weight:800}
    .expiring-table .days-mid{color:#d97706;font-weight:800}
    .expiring-table .days-expired{color:#6b21a8;font-weight:800;background:rgba(107,33,168,.08);padding:2px 8px;border-radius:10px}
    .expiring-table .account-data{font-family:'SF Mono',Consolas,monospace;font-size:11px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ─── COMPRAS RECIENTES ─── */
    .compras-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
    .compras-card .card-header{padding:16px 18px;border-bottom:1px solid var(--line)}
    .compras-card .card-header h2{font-size:16px;font-weight:900;color:var(--purple);margin-bottom:2px}
    .compras-card .card-header p{font-size:11px;color:var(--muted)}
    .compra-item{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);transition:background .15s}
    .compra-item:last-child{border-bottom:none}
    .compra-item:hover{background:rgba(8,119,255,.03)}
    .compra-item .compra-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;font-weight:900;color:#fff}
    .compra-item .compra-info{flex:1;min-width:0}
    .compra-item .compra-name{font-size:12px;font-weight:800;color:var(--text);line-height:1.2;margin-bottom:2px;text-transform:uppercase}
    .compra-item .compra-price{font-size:14px;font-weight:1000;color:var(--purple)}
    .compra-item .compra-date{font-size:10px;color:var(--muted)}

    .login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:32px;padding:32px;overflow:hidden;position:relative}
    .login::before{content:"";position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(8,119,255,.04) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(8,119,255,.03) 0%,transparent 50%);animation:ambientFloat 20s ease-in-out infinite;pointer-events:none;z-index:0}
    .login-visual{height:calc(100vh - 64px);min-height:600px;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,#f8faff 0%,#eef2ff 30%,#e8eeff 60%,#f0f4ff 100%);box-shadow:var(--shadow2),0 0 0 1px rgba(8,119,255,.06);animation:heroIn .7s cubic-bezier(.2,.8,.2,1) both;position:relative;display:flex;align-items:center;justify-content:center}
    .login-visual img{width:100%;height:100%;object-fit:contain;object-position:center center;position:relative;z-index:2;filter:drop-shadow(0 8px 32px rgba(8,119,255,.15))}
    .login-visual::before{content:"";position:absolute;top:50%;left:50%;width:min(420px,85%);height:min(420px,85%);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(8,119,255,.08) 0%,rgba(8,119,255,.03) 40%,transparent 70%);z-index:1;animation:heroGlow 6s ease-in-out infinite alternate}
    .login-visual::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 70%,rgba(255,255,255,.2));pointer-events:none;z-index:3}
    .hero-rings{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(380px,80%);height:min(380px,80%);z-index:1;pointer-events:none}
    .hero-rings .ring{position:absolute;border-radius:50%;border:2px solid rgba(8,119,255,.15);top:50%;left:50%;transform:translate(-50%,-50%)}
    .hero-rings .ring:nth-child(1){width:100%;height:100%;animation:ringPulse 3s ease-in-out infinite}
    .hero-rings .ring:nth-child(2){width:75%;height:75%;border-color:rgba(8,119,255,.2);animation:ringPulse 3s ease-in-out .5s infinite}
    .hero-rings .ring:nth-child(3){width:50%;height:50%;border-color:rgba(8,119,255,.25);animation:ringPulse 3s ease-in-out 1s infinite}
    @keyframes ringPulse{0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(1)}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.03)}}
    @keyframes heroGlow{0%{opacity:.6;transform:translate(-50%,-50%) scale(1)}100%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
    .hero-sphere{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#4da6ff,#0066ff);box-shadow:0 8px 24px rgba(8,119,255,.35),inset 0 -4px 8px rgba(0,0,0,.15);z-index:4;pointer-events:none}
    .hero-sphere.s1{width:42px;height:42px;top:8%;right:12%;animation:floatSphere 5s ease-in-out infinite}
    .hero-sphere.s2{width:28px;height:28px;bottom:18%;left:8%;animation:floatSphere 4s ease-in-out .8s infinite}
    .hero-sphere.s3{width:18px;height:18px;top:22%;left:15%;animation:floatSphere 6s ease-in-out 1.5s infinite}
    .hero-sphere.s4{width:22px;height:22px;bottom:28%;right:6%;animation:floatSphere 4.5s ease-in-out 2s infinite}
    @keyframes floatSphere{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.05)}}
    body.dark .login-visual{background:linear-gradient(160deg,#0a1628 0%,#0d1d31 30%,#111f3a 60%,#0a1628 100%)}
    body.dark .login-visual::after{background:linear-gradient(180deg,transparent 70%,rgba(10,22,40,.3))}
    body.dark .login-visual::before{background:radial-gradient(circle,rgba(59,130,246,.1) 0%,rgba(59,130,246,.04) 40%,transparent 70%)}
    body.dark .hero-rings .ring{border-color:rgba(8,119,255,.2)}

    /* ─── MOBILE HERO ─── */
    .mobile-hero{display:none;position:relative;width:100%;height:200px;margin:-44px -40px 24px;border-radius:0 0 28px 28px;overflow:hidden;background:linear-gradient(135deg,#0a1628 0%,#0d1d31 40%,#111f3a 100%)}
    .mobile-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 80%,rgba(8,119,255,.25) 0%,transparent 60%);animation:mobileGlow 2s ease-in-out infinite alternate}
    .mobile-hero::after{content:"";position:absolute;width:300px;height:300px;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(8,119,255,.15);animation:mobileRing 3s linear infinite}
    @keyframes mobileGlow{0%{opacity:.5;transform:scale(1)}100%{opacity:1;transform:scale(1.1)}}
    @keyframes mobileRing{to{transform:translate(-50%,-50%) rotate(360deg)}}
    .mobile-hero .hero-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:3}
    .mobile-hero .hero-logo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid rgba(8,119,255,.4);box-shadow:0 0 40px rgba(8,119,255,.4),0 0 80px rgba(8,119,255,.15);animation:heroLogoPulse 1.5s ease-in-out infinite}
    @keyframes heroLogoPulse{0%,100%{box-shadow:0 0 40px rgba(8,119,255,.4),0 0 80px rgba(8,119,255,.15);transform:translate(-50%,-50%) scale(1)}50%{box-shadow:0 0 60px rgba(8,119,255,.6),0 0 120px rgba(8,119,255,.25);transform:translate(-50%,-50%) scale(1.05)}}
    .mobile-hero .hero-glow{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(8,119,255,.3),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:mobileGlow 1.5s ease-in-out infinite}
    .mobile-hero .hero-orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#4da6ff,#0066ff);box-shadow:0 4px 16px rgba(8,119,255,.4);animation:orbFloat 3s ease-in-out infinite}
    .mobile-hero .hero-orb.o1{width:16px;height:16px;top:20%;right:15%;animation-delay:0s}
    .mobile-hero .hero-orb.o2{width:10px;height:10px;bottom:25%;left:10%;animation-delay:.8s}
    .mobile-hero .hero-orb.o3{width:8px;height:8px;top:30%;left:20%;animation-delay:1.5s}
    .mobile-hero .hero-orb.o4{width:12px;height:12px;bottom:20%;right:20%;animation-delay:2s}
    @keyframes orbFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.1)}}
    .mobile-hero .hero-rings-m{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:180px}
    .mobile-hero .hero-rings-m .ring{position:absolute;border-radius:50%;border:1.5px solid rgba(8,119,255,.12);top:50%;left:50%;transform:translate(-50%,-50%);animation:ringPulse 2s ease-in-out infinite}
    .mobile-hero .hero-rings-m .ring:nth-child(1){width:100%;height:100%}
    .mobile-hero .hero-rings-m .ring:nth-child(2){width:70%;height:70%;border-color:rgba(8,119,255,.18);animation-delay:.5s}
    .mobile-hero .hero-rings-m .ring:nth-child(3){width:40%;height:40%;border-color:rgba(8,119,255,.24);animation-delay:1s}

    body.dark .mobile-hero{background:linear-gradient(135deg,#050d1a 0%,#0a1628 40%,#0d1d31 100%)}
    body.dark .hero-sphere{background:radial-gradient(circle at 30% 30%,#3b82f6,#1d4ed8);box-shadow:0 8px 24px rgba(8,119,255,.35),inset 0 -4px 8px rgba(0,0,0,.25)}
    .login-panel{width:min(460px,100%);justify-self:center;background:rgba(255,255,255,.97);border:1px solid rgba(216,230,248,.5);border-radius:28px;box-shadow:0 28px 72px rgba(0,0,0,.07),0 0 0 1px rgba(255,255,255,.9) inset;backdrop-filter:blur(24px);animation:loginIn .55s cubic-bezier(.2,.8,.2,1) both;position:relative;overflow:hidden;padding:44px 40px 36px}
    .login-panel::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(8,119,255,.4),rgba(8,119,255,.3),transparent)}
    .login-panel::after{content:"";position:absolute;top:-60%;right:-40%;width:80%;height:80%;background:radial-gradient(circle,rgba(8,119,255,.025) 0%,transparent 70%);pointer-events:none}
    body.dark .login-panel{background:rgba(13,29,49,.96);border-color:rgba(30,54,82,.5);box-shadow:0 28px 72px rgba(0,0,0,.35),0 0 0 1px rgba(8,119,255,.08) inset}
    body.dark .login-panel::before{background:linear-gradient(90deg,transparent,rgba(8,119,255,.5),rgba(8,119,255,.3),transparent)}
    body.dark .login-panel::after{background:radial-gradient(circle,rgba(8,119,255,.035) 0%,transparent 70%)}
    .login-brand{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:20px}
    .brand-logo{width:52px;height:52px;border-radius:14px;object-fit:cover;box-shadow:0 8px 24px rgba(8,119,255,.2),0 0 0 2px rgba(8,119,255,.08);transition:transform .3s ease,box-shadow .3s ease}
    .brand-logo:hover{transform:scale(1.06) rotate(-2deg);box-shadow:0 12px 32px rgba(8,119,255,.28),0 0 0 2px rgba(8,119,255,.12)}
    .brand-title{font-weight:1000;font-size:24px;line-height:.85;letter-spacing:-.03em}
    .brand-title em{display:block;color:var(--blue);font-style:italic;font-weight:900;font-size:26px;letter-spacing:-.02em}
    .login-panel h1{text-align:center;font-size:32px;line-height:1.08;margin-bottom:8px;font-weight:900;letter-spacing:-.025em}
    .login-panel h1 span{color:var(--blue);position:relative}
    .login-panel h1 span::after{content:"";position:absolute;bottom:-3px;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:2px;opacity:.7}
    .login-panel>p{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:22px;line-height:1.65;max-width:310px;margin-left:auto;margin-right:auto}
    .role-title{text-align:center;color:var(--blue);font-size:11px;font-weight:1000;letter-spacing:.14em;margin-bottom:8px}
    .role-toggle{display:grid;grid-template-columns:1fr 1fr;padding:6px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,255,255,.6);box-shadow:inset 0 2px 8px rgba(15,23,42,.03)}
    body.dark .role-toggle{background:rgba(18,37,59,.8)}
    .role-toggle button{border:0;border-radius:13px;background:transparent;color:var(--muted);font-weight:900;padding:13px 10px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;transition:all .2s ease}
    body.dark .role-toggle button{color:#8da0b8}
    .role-toggle button:hover:not(.active){background:var(--soft);color:var(--text)}
    .role-toggle button.active{background:linear-gradient(135deg,#0877ff,#0877ff);color:#fff;box-shadow:0 12px 28px rgba(8,119,255,.25)}
    .field{height:50px;margin-top:12px;display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;background:rgba(255,255,255,.95);padding:0 16px;box-shadow:0 2px 8px rgba(15,23,42,.02),inset 0 1px 2px rgba(255,255,255,.9);transition:border-color .25s ease,box-shadow .25s ease,transform .2s ease}
    .field:hover{border-color:rgba(8,119,255,.25);transform:translateY(-1px)}
    .field:focus-within{border-color:var(--purple);box-shadow:0 0 0 4px rgba(8,119,255,.1),0 4px 16px rgba(8,119,255,.08),inset 0 1px 2px rgba(255,255,255,.9);transform:translateY(-1px)}
    body.dark .field{background:rgba(18,37,59,.9);border-color:#1e3652;box-shadow:0 2px 8px rgba(0,0,0,.15),inset 0 1px 2px rgba(255,255,255,.03)}
    body.dark .field:hover{border-color:rgba(8,119,255,.4)}
    body.dark .field:focus-within{border-color:#3b82f6;box-shadow:0 0 0 4px rgba(8,119,255,.15),0 4px 16px rgba(8,119,255,.1),inset 0 1px 2px rgba(255,255,255,.03)}
    body.dark .field svg,.body.dark .field .mini-ico svg{stroke:#4da6ff}
    .field svg,.mini-ico svg{width:18px;height:18px;stroke:var(--muted);flex-shrink:0;transition:stroke .25s ease,transform .25s ease}
    .field:focus-within svg{stroke:var(--blue);transform:scale(1.1)}
    .mini-ico{display:inline-flex;align-items:center;justify-content:center;min-width:20px}
    .field input{width:100%;outline:0;background:transparent!important;color:var(--text);font-size:15px;font-weight:500;-webkit-text-fill-color:var(--text);caret-color:var(--blue);transition:color .2s}
    body.dark .field input{background:rgba(18,37,59,.98)!important;-webkit-text-fill-color:#eef6ff!important;color:#eef6ff!important;caret-color:#60a5fa}
    .field input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);font-weight:400}
    input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,textarea:-webkit-autofill,select:-webkit-autofill{-webkit-text-fill-color:var(--text)!important;-webkit-box-shadow:0 0 0 1000px var(--panel) inset!important;transition:background-color 5000s ease-in-out 0s}
    body.dark input:-webkit-autofill,body.dark input:-webkit-autofill:hover,body.dark input:-webkit-autofill:focus,body.dark textarea:-webkit-autofill,body.dark select:-webkit-autofill{-webkit-text-fill-color:#eef6ff!important;-webkit-box-shadow:0 0 0 1000px rgba(13,29,49,.95) inset!important;background-color:rgba(13,29,49,.95)!important;color:#eef6ff!important}
    .login-options{display:flex;justify-content:space-between;align-items:center;margin:16px 0 28px;font-size:13px;color:var(--muted)}
    .check{display:flex;gap:8px;align-items:center;cursor:pointer;transition:color .2s}
    .check:hover{color:var(--text)}
    .check input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px;cursor:pointer;border-radius:4px}
    .login-options a{font-weight:700;font-size:13px;transition:color .2s,transform .2s}
    .login-options a:hover{color:var(--blue2);transform:translateX(2px)}
    .primary,.ghost,.danger-btn,.ok-btn{border:0;border-radius:var(--radius);font-weight:1000;padding:12px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;font-size:14px;transition:transform .2s ease,box-shadow .2s ease}
    .primary{background:linear-gradient(135deg,#0877ff,#0877ff);color:#fff;box-shadow:0 12px 28px rgba(8,119,255,.25);position:relative;overflow:hidden}
    .primary::after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:left .6s ease}
    .primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(8,119,255,.32)}
    .primary:hover::after{left:120%}
    .primary:active{transform:translateY(0);box-shadow:0 8px 20px rgba(8,119,255,.2)}
    .primary.loading{pointer-events:none;opacity:.85}
    .primary.loading .btn-text{opacity:0}
    .primary.loading::before{content:"";position:absolute;width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ghost{background:var(--panel);border:1px solid var(--line);color:var(--blue);transition:all .18s ease}
    .ghost:hover{background:rgba(8,119,255,.06);border-color:rgba(8,119,255,.3);transform:translateY(-1px)}
    .danger-btn{background:#fff6ed;border:1px solid #ffd6ad;color:#e65100}
    body.dark .danger-btn{background:rgba(50,27,16,.6);border-color:rgba(107,52,20,.5);color:#ffb36e}
    .ok-btn{background:#12a454;color:#fff;box-shadow:0 12px 24px rgba(18,164,84,.16)}
    .login-panel .primary{width:100%;height:52px;font-size:16px;border-radius:12px;font-weight:800;letter-spacing:.3px}

    /* ─── DOWNLOAD SECTION ─── */
    .download-section{margin-top:28px;text-align:center}
    .download-divider{display:flex;align-items:center;gap:16px;margin-bottom:16px}
    .download-divider::before,.download-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
    .download-divider span{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
    .download-buttons{display:flex;gap:12px;justify-content:center}
    .download-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 28px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;transition:all .25s ease;border:1.5px solid transparent;min-width:140px;letter-spacing:.01em;position:relative}
    .download-btn:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,0,0,.3)}
    .download-btn:active{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.2)}
    .download-btn.android{background:#111;color:#fff;border-color:rgba(255,255,255,.08)}
    .download-btn.android:hover{background:#1a1a1a;box-shadow:0 14px 32px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.1)}
    .download-btn.ios{background:#111;color:#fff;border-color:rgba(255,255,255,.08)}
    .download-btn.ios:hover{background:#1a1a1a;box-shadow:0 14px 32px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.1)}
    .download-btn svg{flex-shrink:0;transition:transform .2s}
    .download-btn:hover svg{transform:scale(1.1)}
    .download-btn.loading{pointer-events:none;opacity:1;background:#0a0a0a!important;border-color:rgba(8,119,255,.5)!important;box-shadow:0 0 20px rgba(8,119,255,.3),0 0 40px rgba(8,119,255,.1)!important}
    .download-btn.loading .dl-text{opacity:0;width:0;overflow:hidden}
    .download-btn.loading .dl-text::after{content:"Instalando...";opacity:1;width:auto;overflow:visible;position:absolute;right:-10px;top:50%;transform:translateY(-50%);white-space:nowrap}
    .download-btn.loading::before{content:"";position:absolute;left:12px;width:20px;height:20px;border:3px solid rgba(255,255,255,.2);border-top-color:#0877ff;border-right-color:#00d4ff;border-radius:50%;animation:spin .7s linear infinite;filter:drop-shadow(0 0 4px rgba(8,119,255,.6))}
    .download-btn.loading::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(90deg,transparent,rgba(8,119,255,.1),transparent);animation:btnShimmer 1.5s ease-in-out infinite}
    @keyframes btnShimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
    body.dark .download-btn.android{background:linear-gradient(135deg,rgba(30,54,82,.9),rgba(18,37,59,.95));border-color:rgba(8,119,255,.2)}
    body.dark .download-btn.android:hover{background:linear-gradient(135deg,rgba(40,70,100,.95),rgba(25,50,80,1));box-shadow:0 12px 28px rgba(0,0,0,.4),0 0 0 1px rgba(8,119,255,.3)}
    body.dark .download-btn.ios{background:linear-gradient(135deg,rgba(30,54,82,.9),rgba(18,37,59,.95));border-color:rgba(8,119,255,.2)}
    body.dark .download-btn.ios:hover{background:linear-gradient(135deg,rgba(40,70,100,.95),rgba(25,50,80,1));box-shadow:0 12px 28px rgba(0,0,0,.4),0 0 0 1px rgba(8,119,255,.3)}

    .secure{text-align:center;color:var(--muted);font-weight:600;margin-top:20px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:4px;opacity:.8}
    .secure svg{opacity:.7}

    /* ─── PAYMENT TABS ─── */
    .payment-tabs{display:flex;gap:6px;padding:6px;background:var(--soft);border-radius:var(--radius);margin-bottom:16px;border:1px solid var(--line)}
    .payment-tab{flex:1;padding:12px 8px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
    .payment-tab:hover:not(.active){background:rgba(8,119,255,.06);color:var(--text)}
    .payment-tab.active{background:var(--panel);color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.06);font-weight:800}
    .payment-tab svg{width:22px;height:22px}
    .payment-tab .tab-label{font-size:11px;color:var(--muted);font-weight:600}
    .payment-tab.active .tab-label{color:var(--blue)}
    .payment-content{display:none}
    .payment-content.active{display:block;animation:fadeIn .3s ease}
    .whatsapp-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:0;border-radius:12px;background:#25D366;color:#fff;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s}
    .whatsapp-btn:hover{background:#1da851;transform:translateY(-1px);box-shadow:0 8px 20px rgba(37,211,102,.3)}
    .whatsapp-btn svg{width:22px;height:22px;fill:#fff}
    .wompi-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#6C63FF,#5A52E0);color:#fff;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s}
    .wompi-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(108,99,255,.3)}
    .payment-info{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
    .payment-info-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
    .payment-info-row:last-child{border-bottom:none}
    .payment-info-row svg{width:18px;height:18px;stroke:var(--blue);flex-shrink:0}
    .payment-info-row b{font-size:13px}
    .payment-info-row span{font-size:12px;color:var(--muted)}
    body.dark .payment-tabs{background:rgba(18,37,59,.6);border-color:#1e3652}
    body.dark .payment-tab.active{background:rgba(13,29,49,.9);color:#60a5fa}
    body.dark .payment-info{background:rgba(18,37,59,.5);border-color:#1e3652}

    /* ─── METHOD CARDS ─── */
    .method-card{display:flex;flex-direction:column;align-items:center;padding:20px 12px;border:2px solid var(--line);border-radius:16px;background:var(--panel);cursor:pointer;transition:all .25s;text-align:center}
    .method-card:hover{border-color:rgba(8,119,255,.3);transform:translateY(-2px);box-shadow:0 8px 20px rgba(8,119,255,.1)}
    .method-card.active{border-color:var(--blue);background:rgba(8,119,255,.04);box-shadow:0 4px 16px rgba(8,119,255,.12)}
    body.dark .method-card{background:rgba(13,29,49,.8);border-color:#1e3652}
    body.dark .method-card:hover{border-color:rgba(59,130,246,.4);box-shadow:0 8px 20px rgba(59,130,246,.1)}
    body.dark .method-card.active{border-color:#3b82f6;background:rgba(59,130,246,.08)}

    /* ─── QUICK AMOUNT BUTTONS ─── */
    .quick-amount-btn{padding:12px 8px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-size:13px;font-weight:800;cursor:pointer;transition:all .2s}
    .quick-amount-btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
    .quick-amount-btn.active{border-color:var(--blue);background:rgba(8,119,255,.08);color:var(--blue);box-shadow:0 2px 8px rgba(8,119,255,.15)}
    body.dark .quick-amount-btn{background:rgba(13,29,49,.8);border-color:#1e3652;color:#eef6ff}
    body.dark .quick-amount-btn:hover{border-color:#3b82f6;color:#60a5fa}
    body.dark .quick-amount-btn.active{border-color:#3b82f6;background:rgba(59,130,246,.15);color:#60a5fa}

    /* ─── TOPUP AMOUNT BUTTONS ─── */
    .topup-amt{padding:10px 6px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-size:12px;font-weight:800;cursor:pointer;transition:all .2s}
    .topup-amt:hover{border-color:var(--blue);color:var(--blue)}
    .topup-amt.active{border-color:var(--blue);background:rgba(8,119,255,.08);color:var(--blue)}
    body.dark .topup-amt{background:rgba(13,29,49,.8);border-color:#1e3652;color:#eef6ff}
    body.dark .topup-amt.active{border-color:#3b82f6;background:rgba(59,130,246,.15);color:#60a5fa}

    /* ─── REGISTER LINK ─── */
    .register-link{text-align:center;margin-top:20px;font-size:14px;color:var(--muted);animation:fadeIn .5s ease .7s both}
    .register-link a{color:var(--blue);font-weight:700;cursor:pointer;text-decoration:none;transition:color .2s}
    .register-link a:hover{color:var(--blue2);text-decoration:underline}

    /* ─── REGISTER FORM ─── */
    .register-panel{display:none}
    .register-panel.show{display:block;animation:loginIn .4s cubic-bezier(.2,.8,.2,1)}
    .register-panel h1{color:var(--blue)}

    .app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
    .side{position:sticky;top:0;height:100vh;background:rgba(255,255,255,.85);border-right:1px solid var(--line);padding:20px 14px;backdrop-filter:blur(16px);display:flex;flex-direction:column;z-index:10}
    body.dark .side{background:rgba(8,20,35,.9)}
    .side-brand{display:flex;align-items:center;gap:10px;padding:4px 6px 20px}
    .side-brand img{width:48px;height:48px;border-radius:14px;object-fit:cover}
    .side-brand b{font-size:19px;line-height:.95;display:block}
    .side-brand em{display:block;color:var(--blue);font-style:italic;font-weight:1000}
    .nav-title{font-size:11px;font-weight:1000;color:var(--muted);letter-spacing:.08em;margin:18px 8px 8px;text-transform:uppercase}
    .nav{display:grid;gap:6px}
    .nav button{border:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:10px;padding:11px;border-radius:var(--radius);font-weight:800;text-align:left;font-size:14px;transition:all .18s ease;position:relative}
    .nav button svg{width:18px;height:18px;stroke:var(--blue);flex-shrink:0;transition:stroke .18s}
    .nav button.active{background:linear-gradient(135deg,#0877ff,#0877ff);color:#fff;box-shadow:0 12px 26px rgba(8,119,255,.25)}
    .nav button.active::before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;background:#fff;border-radius:0 3px 3px 0}
    .nav button.active svg{stroke:#fff}
    .nav button:not(.active):hover{background:var(--soft);transform:translateX(3px)}
    .profile-card{margin-top:auto;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 24px rgba(15,23,42,.04);transition:all .2s}
    .profile-card:hover{border-color:rgba(8,119,255,.2);box-shadow:0 12px 28px rgba(8,119,255,.08)}
    .profile-top{display:flex;align-items:center;gap:12px}
    .avatar{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0877ff,#0877ff);color:#fff;display:grid;place-items:center;font-weight:1000;font-size:15px;flex-shrink:0;box-shadow:0 4px 12px rgba(8,119,255,.25)}
    .profile-info{flex:1;min-width:0;overflow:hidden}
    .profile-name{font-size:14px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
    .profile-email{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .profile-role{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-top:4px}
    .profile-role.admin{background:rgba(245,158,11,.15);color:#f59e0b}
    .profile-role.reseller{background:rgba(8,119,255,.15);color:#0877ff}
    .profile-role.client{background:rgba(16,185,129,.15);color:#10b981}
    .profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .profile-stat{text-align:center;padding:6px 4px;background:var(--soft);border-radius:8px}
    .profile-stat .stat-value{font-size:14px;font-weight:900;color:var(--text);display:block}
    .profile-stat .stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
    .profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .profile-action{display:flex;align-items:center;justify-content:center;gap:5px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:10px;font-weight:700;cursor:pointer;transition:all .15s}
    .profile-action:hover{background:rgba(8,119,255,.06);border-color:rgba(8,119,255,.3)}
    .profile-action svg{width:14px;height:14px;stroke:var(--blue)}
    .profile-card .logout-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--muted);display:grid;place-items:center;flex-shrink:0;transition:all .18s}
    .profile-card .logout-btn:hover{background:rgba(239,68,68,.1);color:#ef4444;border-color:rgba(239,68,68,.3)}

    .main{padding:22px;min-width:0;overflow-y:auto}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
    .top h1{margin-bottom:3px;font-size:26px}
    .top p{font-size:13px;color:var(--muted)}
    .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}

    /* ─── USER MENU ─── */
    .user-header{display:flex;align-items:center;gap:6px}
    .header-icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:all .18s;position:relative}
    .header-icon-btn:hover{border-color:rgba(8,119,255,.3);background:rgba(8,119,255,.06)}
    .header-icon-btn svg{width:18px;height:18px;stroke:var(--text)}
    .header-balance{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:6px;padding:0 12px;font-weight:800;font-size:14px;color:var(--text);cursor:pointer;transition:all .18s}
    .header-balance:hover{border-color:rgba(8,119,255,.3)}
    .header-balance svg{width:16px;height:16px;stroke:var(--blue)}
    .header-balance .bal-label{font-size:10px;color:var(--muted);font-weight:600}
    .user-avatar-btn{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0877ff,#0057dc);color:#fff;display:grid;place-items:center;cursor:pointer;border:2px solid transparent;transition:all .18s;font-weight:1000;font-size:15px}
    .user-avatar-btn:hover{border-color:rgba(8,119,255,.4);box-shadow:0 4px 12px rgba(8,119,255,.25)}
    .user-dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 16px 48px rgba(0,0,0,.12);z-index:50;display:none;overflow:hidden}
    .user-dropdown.show{display:block;animation:dropdownIn .2s cubic-bezier(.2,.8,.2,1)}
    @keyframes dropdownIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
    .user-dropdown-item{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;transition:background .15s;border:0;background:transparent;width:100%;text-align:left}
    .user-dropdown-item:hover{background:rgba(8,119,255,.06)}
    .user-dropdown-item svg{width:18px;height:18px;stroke:var(--muted);flex-shrink:0}
    .user-dropdown-item.danger{color:#ef4444}
    .user-dropdown-item.danger svg{stroke:#ef4444}
    .user-dropdown-divider{height:1px;background:var(--line);margin:4px 0}
    body.dark .header-icon-btn{background:rgba(13,29,49,.85);border-color:#1e3652}
    body.dark .header-icon-btn:hover{border-color:rgba(8,119,255,.3);background:rgba(8,119,255,.08)}
    body.dark .header-balance{background:rgba(13,29,49,.85);border-color:#1e3652;color:#eef6ff}
    body.dark .user-dropdown{background:#0d1d31;border-color:#1e3652;box-shadow:0 16px 48px rgba(0,0,0,.3)}
    body.dark .user-dropdown-item{color:#eef6ff}
    body.dark .user-dropdown-item:hover{background:rgba(8,119,255,.08)}
    .pill{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:8px 14px;box-shadow:0 8px 20px rgba(15,23,42,.04);font-weight:900;display:inline-flex;align-items:center;gap:8px;min-height:42px;font-size:14px;transition:all .18s;white-space:nowrap;color:var(--text);overflow:visible}
    .pill:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(8,119,255,.1)}
    .pill small{display:block;color:var(--muted);font-weight:700;font-size:10px}
    .notice-dot{min-width:22px;height:22px;border-radius:999px;background:var(--blue);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:1000;animation:dotPulse 2s ease-in-out infinite}
    @keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(8,119,255,.4)}50%{box-shadow:0 0 0 6px rgba(8,119,255,0)}}
    @keyframes pulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 0 5px rgba(16,185,129,0)}}

    .section{margin-top:14px}
    .grid{display:grid;gap:12px}
    .metrics{grid-template-columns:repeat(4,1fr)}
    .metric{display:flex;align-items:center;gap:12px}
    .metric b{font-size:22px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:all .2s ease}
    .card:hover{box-shadow:0 16px 40px rgba(8,119,255,.08)}
    body.dark .card:hover{box-shadow:0 16px 40px rgba(0,0,0,.2),0 0 0 1px rgba(8,119,255,.08)}
    .card h2{font-size:18px;margin-bottom:4px}
    .quick{grid-template-columns:1.1fr repeat(4,1fr);align-items:stretch}
    .quick-intro{padding:14px 6px}
    .quick-btn{min-height:80px;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);color:var(--text);font-weight:900;display:grid;place-items:center;gap:5px;transition:.18s;box-shadow:0 10px 22px rgba(15,23,42,.04);position:relative;overflow:hidden;font-size:13px}
    .quick-btn svg{width:24px;height:24px;stroke:var(--blue)}
    .quick-btn:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(8,119,255,.14)}
    .quick-btn.primary-q{background:linear-gradient(135deg,#0877ff,#0877ff);color:#fff}
    .quick-btn.primary-q svg{stroke:#fff}
    .quick-btn span{position:relative;z-index:1}

    .store-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .product{padding:0;overflow:hidden;border-radius:20px;position:relative;transition:.25s;background:#fff;border:1px solid #e0e0e8;backdrop-filter:blur(12px)}
    .product:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(8,119,255,.2),0 0 30px rgba(8,119,255,.08);border-color:rgba(8,119,255,.25)}
    .poster{height:140px;padding:20px 14px 8px;overflow:hidden;position:relative;background:transparent;display:flex;align-items:center;justify-content:center}
    .poster:before,.poster:after,.poster .svc,.poster .shine,.poster .brandmark{display:none}
    .poster .logo-word{position:relative;left:auto;right:auto;bottom:auto;margin:0 auto;width:fit-content;display:flex;align-items:center;justify-content:center;height:100%}
    .poster .stock{position:absolute;right:14px;top:14px;z-index:2;border-radius:10px;background:rgba(0,0,0,.06);color:#666;padding:6px 12px;font-size:11px;font-weight:700;border:1px solid rgba(0,0,0,.08)}
    .product-body{padding:4px 20px 20px;text-align:center}
    .product .mini{color:#888;font-size:11px;margin-bottom:8px;display:block}
    .product .price{font-size:26px;font-weight:1000;color:#0877ff;margin:8px 0 14px}
    .product .divider{height:1px;background:linear-gradient(90deg,transparent,#e0e0e8,transparent);margin:0 0 14px}
    .product .primary{width:100%;background:linear-gradient(135deg,#0891ff,#00d4ff);border:none;border-radius:12px;padding:13px;font-size:13px;font-weight:800;color:#fff;box-shadow:0 8px 24px rgba(0,150,255,.25);transition:all .2s}
    .product .primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,150,255,.35)}
    .product.unavailable{opacity:.4;filter:saturate(.3)}
    .product.unavailable:before{content:"AGOTADO";position:absolute;z-index:5;right:14px;top:14px;background:rgba(239,68,68,.9);color:#fff;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:1000;backdrop-filter:blur(8px)}
    .product .tag{position:absolute;left:14px;top:14px;z-index:2;background:rgba(0,0,0,.06);color:#666;border:1px solid rgba(0,0,0,.08);font-size:10px;padding:4px 8px}
    body.dark .product .tag{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.1)}
    .netflix{--accent:#ef1437}.prime{--accent:#00b8ff}.max{--accent:#0877ff}
    .disney{--accent:#0a74ff}.spotify{--accent:#1db954}.youtube{--accent:#ff0033}.other{--accent:#7aa6c8}
    .tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#e9f9f0;color:#087a35;font-size:11px;font-weight:1000;transition:all .15s ease}
    .tag.warn{background:#fff6d8;color:#8a5b00}.tag.bad{background:#ffe8e8;color:#b91c1c}
    .tag.personal{background:#ede9fe;color:#6d28d9}
    .tag.sharable{background:#e0f2fe;color:#0369a1}
    .price{font-size:22px;font-weight:1000;margin:8px 0 2px}
    .mini{font-size:11px;color:var(--muted)}
    .product .primary,.product .ghost{width:100%;margin-top:10px}

    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);-webkit-overflow-scrolling:touch;background:var(--panel)}
    table{width:100%;border-collapse:collapse;min-width:800px}
    th,td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
    th{font-size:11px;color:var(--muted);background:var(--soft);text-transform:uppercase;font-weight:800;position:sticky;top:0;z-index:1;letter-spacing:.05em}
    td{font-size:13px;color:var(--text)}
    tr{transition:background .15s}
    tr:hover{background:rgba(8,119,255,.03)}
    body.dark tr:hover{background:rgba(8,119,255,.06)}
    .op-id{font-weight:800;color:var(--blue);font-size:12px}
    .op-product{display:flex;align-items:center;gap:10px}
    .op-product-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
    .op-product-icon svg{width:24px;height:24px}
    .op-product-name{font-weight:700;font-size:13px}
    .op-product-sub{font-size:11px;color:var(--muted)}
    .op-user{display:flex;align-items:center;gap:8px}
    .op-user svg{width:16px;height:16px;stroke:var(--muted);flex-shrink:0}
    .op-date{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
    .op-date svg{width:14px;height:14px;stroke:var(--muted)}
    .op-amount{font-weight:900;font-size:14px}
    .status-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800}
    .status-badge.completed{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.2)}
    .status-badge.pending{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
    .status-badge.failed{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
    .status-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .op-action{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--blue);display:grid;place-items:center;cursor:pointer;transition:all .18s}
    .op-action:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
    td input{border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:var(--soft);color:var(--text);width:110px;font-weight:800}
    body.dark td input{background:rgba(18,37,59,.7);color:var(--text);border-color:#1e3652}
    td input:disabled{opacity:.5}
    .row-actions{display:flex;gap:7px;flex-wrap:wrap}
    .split{grid-template-columns:1.2fr .8fr}
    .form{display:grid;gap:10px}
    .form label{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:4px}
    .form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;background:var(--panel);color:var(--text);outline:none;font-size:14px;transition:border-color .2s,box-shadow .2s}
    body.dark .form input,body.dark .form select,body.dark .form textarea{background:rgba(18,37,59,.7);color:var(--text);border-color:#1e3652}
    body.dark .ops-toolbar input,body.dark .ops-toolbar select{background:rgba(18,37,59,.7);color:var(--text);border-color:#1e3652}
    body.dark td input{background:rgba(18,37,59,.7);color:var(--text);border-color:#1e3652}
    .form input:focus,.form select:focus,.form textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,119,255,.18)}
    .form textarea{min-height:90px;resize:vertical}
    .list{display:grid;gap:8px}
    .list-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:12px;transition:all .18s ease}
    .list-row:hover{border-color:rgba(8,119,255,.25);box-shadow:0 4px 16px rgba(8,119,255,.06)}
    .list-row.compact-order{grid-template-columns:100px 1fr auto}
    .ops-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
    .ops-toolbar input,.ops-toolbar select{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px;background:var(--panel);color:var(--text);font-size:14px}
    body.dark .ops-toolbar input,body.dark .ops-toolbar select{background:rgba(18,37,59,.7);color:var(--text);border-color:#1e3652}
    .ops-toolbar input{min-width:220px;flex:1}
    .client-data{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
    .client-data span{background:var(--soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 9px;font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .copy-box{background:var(--soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px;font-weight:800;word-break:break-word;font-size:13px}
    .modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(15,23,42,.5);backdrop-filter:blur(12px);z-index:30;padding:14px}
    .modal.show{display:grid}
    .dialog{width:min(580px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow2);padding:20px;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
    .dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
    .dialog-head h2{margin:0;font-size:20px}
    .close{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--soft);color:var(--text);font-weight:1000;font-size:16px;transition:all .18s}
    .close:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
    .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;background:#071526;color:#fff;border-radius:var(--radius);padding:12px 18px;box-shadow:0 14px 28px rgba(0,0,0,.25);transition:all .25s cubic-bezier(.2,.8,.2,1);z-index:50;font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.ok{background:#075c32}.toast.ok::before{content:"✓"}.toast.bad{background:#8b1c1c}.toast.bad::before{content:"✕"}
    .alerts-panel{position:fixed;right:18px;top:68px;width:min(380px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow2);padding:12px;z-index:25;display:none}
    .alerts-panel.show{display:grid;gap:8px;animation:pop .15s ease}
    .success-pulse{display:grid;place-items:center;margin:6px auto 14px;width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#e8fff2,#c7f7db);color:var(--ok);font-size:34px;animation:pulse 1s ease-out 2}
    .admin-action{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--radius);background:var(--soft);padding:11px;transition:all .18s ease}
    .admin-action:hover{border-color:rgba(8,119,255,.25);box-shadow:0 4px 16px rgba(8,119,255,.06)}
    .admin-action svg{width:22px;height:22px;stroke:var(--blue)}
    .admin-action b{display:block;font-size:14px}
    .admin-action .ghost,.admin-action .primary{min-width:100px;font-size:13px}

    /* ─── PREMIUM METRIC CARDS ─── */
    .premium-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
    .premium-card{position:relative;border-radius:20px;padding:24px 16px 20px;text-align:center;overflow:hidden;cursor:pointer;transition:all .3s cubic-bezier(.2,.8,.2,1);border:1px solid rgba(255,255,255,.08);min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
    .premium-card::before{content:"";position:absolute;inset:0;opacity:.15;transition:opacity .3s}
    .premium-card::after{content:"";position:absolute;top:50%;left:50%;width:200px;height:200px;transform:translate(-50%,-50%);border-radius:50%;opacity:.08;animation:premiumPulse 3s ease-in-out infinite}
    .premium-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .premium-card:hover::before{opacity:.25}

    /* Card themes */
    .premium-card.blue{background:linear-gradient(135deg,#0a1628 0%,#0d2847 50%,#0a1e3d 100%)}
    .premium-card.blue::before{background:radial-gradient(circle at 50% 60%,rgba(8,119,255,.4) 0%,transparent 70%)}
    .premium-card.blue::after{background:radial-gradient(circle,rgba(8,119,255,.3),transparent 70%);animation-delay:0s}
    .premium-card.green{background:linear-gradient(135deg,#0a1a14 0%,#0d2e1f 50%,#0a2018 100%)}
    .premium-card.green::before{background:radial-gradient(circle at 50% 60%,rgba(16,185,129,.4) 0%,transparent 70%)}
    .premium-card.green::after{background:radial-gradient(circle,rgba(16,185,129,.3),transparent 70%);animation-delay:.5s}
    .premium-card.orange{background:linear-gradient(135deg,#1a1408 0%,#2e1f0d 50%,#20180a 100%)}
    .premium-card.orange::before{background:radial-gradient(circle at 50% 60%,rgba(245,158,11,.4) 0%,transparent 70%)}
    .premium-card.orange::after{background:radial-gradient(circle,rgba(245,158,11,.3),transparent 70%);animation-delay:1s}
    .premium-card.red{background:linear-gradient(135deg,#1a0a0a 0%,#2e0d0d 50%,#200a0a 100%)}
    .premium-card.red::before{background:radial-gradient(circle at 50% 60%,rgba(239,68,68,.4) 0%,transparent 70%)}
    .premium-card.red::after{background:radial-gradient(circle,rgba(239,68,68,.3),transparent 70%);animation-delay:1.5s}
    @keyframes premiumPulse{0%,100%{opacity:.05;transform:translate(-50%,-50%) scale(1)}50%{opacity:.15;transform:translate(-50%,-50%) scale(1.2)}}

    /* Orb container */
    .premium-orb-wrap{position:relative;width:90px;height:90px;z-index:2}
    .premium-orb{position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent;animation:orbSpin 2s linear infinite}
    .premium-card.blue .premium-orb{border-top-color:rgba(8,119,255,.6);border-right-color:rgba(8,119,255,.3);filter:drop-shadow(0 0 8px rgba(8,119,255,.5))}
    .premium-card.green .premium-orb{border-top-color:rgba(16,185,129,.6);border-right-color:rgba(16,185,129,.3);filter:drop-shadow(0 0 8px rgba(16,185,129,.5))}
    .premium-card.orange .premium-orb{border-top-color:rgba(245,158,11,.6);border-right-color:rgba(245,158,11,.3);filter:drop-shadow(0 0 8px rgba(245,158,11,.5))}
    .premium-card.red .premium-orb{border-top-color:rgba(239,68,68,.6);border-right-color:rgba(239,68,68,.3);filter:drop-shadow(0 0 8px rgba(239,68,68,.5))}
    .premium-orb.r2{inset:8px;animation-direction:reverse;animation-duration:1.5s;opacity:.5}
    .premium-orb.r3{inset:16px;animation-duration:2.5s;opacity:.3}
    @keyframes orbSpin{to{transform:rotate(360deg)}}

    /* Center number */
    .premium-center{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
    .premium-num{font-size:28px;font-weight:1000;color:#fff;text-shadow:0 0 20px currentColor;line-height:1}
    .premium-card.blue .premium-num{color:#60a5fa;text-shadow:0 0 20px rgba(8,119,255,.6)}
    .premium-card.green .premium-num{color:#34d399;text-shadow:0 0 20px rgba(16,185,129,.6)}
    .premium-card.orange .premium-num{color:#fbbf24;text-shadow:0 0 20px rgba(245,158,11,.6)}
    .premium-card.red .premium-num{color:#f87171;text-shadow:0 0 20px rgba(239,68,68,.6)}

    /* Particles */
    .premium-particles{position:absolute;inset:0;pointer-events:none;z-index:1}
    .premium-particles span{position:absolute;width:3px;height:3px;border-radius:50%;animation:premiumParticle 2s ease-in-out infinite}
    .premium-card.blue .premium-particles span{background:#0877ff}
    .premium-card.green .premium-particles span{background:#10b981}
    .premium-card.orange .premium-particles span{background:#f59e0b}
    .premium-card.red .premium-particles span{background:#ef4444}
    .premium-particles span:nth-child(1){top:15%;left:20%;animation-delay:0s}
    .premium-particles span:nth-child(2){top:25%;right:15%;animation-delay:.4s}
    .premium-particles span:nth-child(3){bottom:20%;left:25%;animation-delay:.8s}
    .premium-particles span:nth-child(4){bottom:30%;right:20%;animation-delay:1.2s}
    @keyframes premiumParticle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:.8;transform:scale(1.5)}}

    /* Label */
    .premium-label{font-size:12px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.05em;text-transform:uppercase;z-index:2;position:relative}

    /* Mobile */
    @media(max-width:1020px){
      .premium-metrics{grid-template-columns:repeat(2,1fr);gap:10px}
      .premium-card{min-height:150px;padding:18px 12px 16px}
      .premium-orb-wrap{width:72px;height:72px}
      .premium-num{font-size:24px}
    }
    @media(max-width:380px){
      .premium-metrics{gap:8px}
      .premium-card{min-height:130px;padding:14px 10px 12px;border-radius:16px}
      .premium-orb-wrap{width:60px;height:60px}
      .premium-num{font-size:20px}
      .premium-label{font-size:10px}
    }
    .report-status{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
    .status-chip{border:1px solid var(--line);background:var(--soft);border-radius:var(--radius);padding:9px;font-size:11px;font-weight:900}
    .status-chip b{display:block;font-size:17px}
    .pay-card{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center;background:linear-gradient(135deg,#fff,#eef7ff);border:1px solid var(--line);border-radius:var(--radius);padding:11px}
    body.dark .pay-card{background:rgba(18,37,59,.6)}
    .pay-card img{width:100%;border-radius:10px}

    .limit-bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:4px}
    .limit-bar-fill{height:100%;border-radius:999px;transition:.3s}
    .limit-bar-fill.ok{background:var(--ok)}.limit-bar-fill.warn{background:var(--warn)}.limit-bar-fill.bad{background:var(--bad)}
    .alert-card{border-left:3px solid var(--warn);background:var(--soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 12px;margin-top:8px}
    .alert-card.danger{border-left-color:var(--bad)}
    .alert-card.info{border-left-color:var(--blue)}
    .pwa-banner{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:14px 18px;z-index:45;box-shadow:0 -8px 24px rgba(0,0,0,.12);align-items:center;justify-content:space-between;gap:12px}
    .pwa-banner.show{display:flex}
    .analytics-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--panel)}
    .analytics-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
    .analytics-row:last-child{border-bottom:none}

    /* ═══════════════════════════════════════════════════════
       EFFECTS SYSTEM - Premium Visual Effects
       ═══════════════════════════════════════════════════════ */

    /* ─── AMBIENT BACKGROUND ─── */
    .app-bg{position:relative;overflow:hidden}
    .app-bg::before{content:"";position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(8,119,255,.04) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(8,119,255,.03) 0%,transparent 50%);animation:ambientFloat 20s ease-in-out infinite;pointer-events:none;z-index:-1}
    @keyframes ambientFloat{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(2%,1%) rotate(1deg)}50%{transform:translate(-1%,2%) rotate(-1deg)}75%{transform:translate(1%,-1%) rotate(0.5deg)}}

    /* ─── PAGE TRANSITIONS ─── */
    .main{animation:pageIn .4s cubic-bezier(.2,.8,.2,1)}
    @keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .card,.list-row,.product,.quick-btn{animation:elementIn .5s cubic-bezier(.2,.8,.2,1) backwards}
    .card:nth-child(1){animation-delay:.05s}
    .card:nth-child(2){animation-delay:.1s}
    .card:nth-child(3){animation-delay:.15s}
    @keyframes elementIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

    /* ─── CARD HOVER EFFECTS ─── */
    .card{transition:all .3s cubic-bezier(.2,.8,.2,1)}
    .card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 20px 40px rgba(8,119,255,.1)}
    body.dark .card:hover{box-shadow:0 20px 40px rgba(0,0,0,.25),0 0 0 1px rgba(8,119,255,.1)}

    /* ─── PRODUCT 3D TILT ─── */
    .product{transform-style:preserve-3d;perspective:1000px}
    .product:hover{transform:translateY(-8px) rotateX(2deg) rotateY(-2deg);box-shadow:0 25px 60px rgba(8,119,255,.25),0 0 40px rgba(8,119,255,.1)}

    /* ─── BUTTON RIPPLE EFFECT ─── */
    .primary,.ok-btn,.quick-btn{position:relative;overflow:hidden}
    .primary::before,.ok-btn::before,.quick-btn::before{content:"";position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,.25);border-radius:50%;transform:translate(-50%,-50%);transition:width .5s,height .5s}
    .primary:active::before,.ok-btn:active::before,.quick-btn:active::before{width:300px;height:300px}

    /* ─── GLOW EFFECTS ─── */
    .primary{box-shadow:0 8px 24px rgba(8,119,255,.25),0 0 0 0 rgba(8,119,255,0)}
    .primary:hover{box-shadow:0 12px 32px rgba(8,119,255,.35),0 0 20px rgba(8,119,255,.2)}
    .product .primary{box-shadow:0 8px 24px rgba(0,212,255,.25),0 0 0 0 rgba(0,212,255,0)}
    .product .primary:hover{box-shadow:0 12px 32px rgba(0,212,255,.4),0 0 25px rgba(0,212,255,.2)}

    /* ─── SUCCESS ANIMATION ─── */
    .success-pulse{animation:successBounce .6s cubic-bezier(.68,-.55,.265,1.55)}
    @keyframes successBounce{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
    .toast.ok{animation:toastSlideIn .4s cubic-bezier(.2,.8,.2,1)}
    @keyframes toastSlideIn{from{opacity:0;transform:translateX(-50%) translateY(20px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

    /* ─── ICON MICRO-INTERACTIONS ─── */
    .nav button svg,.quick-btn svg,.profile-action svg{transition:all .2s ease}
    .nav button:hover svg,.quick-btn:hover svg{transform:scale(1.15)}
    .nav button:active svg,.quick-btn:active svg{transform:scale(.95)}

    /* ─── TAG ANIMATIONS ─── */
    .tag{transition:all .2s cubic-bezier(.2,.8,.2,1)}
    .tag:hover{transform:scale(1.05)}
    .notice-dot{animation:noticePulse 2s ease-in-out infinite}
    @keyframes noticePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

    /* ─── MODAL ANIMATIONS ─── */
    .dialog{animation:modalIn .35s cubic-bezier(.2,.8,.2,1)}
    @keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
    .modal.show{animation:modalOverlay .3s ease}
    @keyframes modalOverlay{from{opacity:0}to{opacity:1}}

    /* ─── LOADING SKELETON GLOW ─── */
    .skeleton{position:relative;overflow:hidden}
    .skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:skeletonGlow 2s infinite}
    @keyframes skeletonGlow{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

    /* ─── GRADIENT BORDER EFFECT ─── */
    .product{background:#fff;border:none;position:relative}
    .product::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1px;background:linear-gradient(135deg,rgba(8,119,255,.15),rgba(8,119,255,.06),rgba(8,119,255,.02));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .product:hover::before{background:linear-gradient(135deg,rgba(8,119,255,.3),rgba(8,119,255,.12),rgba(8,119,255,.05))}
    body.dark .product{background:linear-gradient(180deg,#12253b,#0d1d31);border:none}
    body.dark .product::before{background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(8,119,255,.1),rgba(0,212,255,.05))}
    body.dark .product:hover::before{background:linear-gradient(135deg,rgba(0,212,255,.35),rgba(8,119,255,.15),rgba(0,212,255,.08))}

    /* ─── PULSE RING EFFECT ─── */
    .avatar{position:relative}
    .avatar::after{content:"";position:absolute;inset:-3px;border-radius:14px;border:2px solid rgba(8,119,255,.3);animation:avatarRing 3s ease-in-out infinite}
    @keyframes avatarRing{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.02)}}

    /* ─── FLOATING LABELS ─── */
    .form label{transition:all .2s ease}
    .form label:focus-within{color:var(--blue);transform:translateX(4px)}

    /* ─── SCROLL PROGRESS ─── */
    .main{scrollbar-width:thin;scrollbar-color:rgba(8,119,255,.3) transparent}
    .main::-webkit-scrollbar{width:6px}
    .main::-webkit-scrollbar-thumb{background:rgba(8,119,255,.3);border-radius:999px}
    .main::-webkit-scrollbar-thumb:hover{background:rgba(8,119,255,.5)}

    /* ─── LOADING SPINNER PREMIUM ─── */
    .loading-overlay{position:fixed!important;inset:0!important;background:rgba(7,21,38,.95)!important;backdrop-filter:blur(20px)!important;display:none!important;align-items:center!important;justify-content:center!important;z-index:99999!important;overflow:hidden}
    .loading-overlay::before{content:"";position:absolute;width:900px;height:900px;background:conic-gradient(from 0deg,transparent,rgba(8,119,255,.15),transparent,rgba(0,212,255,.1),transparent,rgba(124,58,237,.12),transparent);top:50%;left:50%;transform:translate(-50%,-50%);animation:loaderBgSpin 3s linear infinite}
    .loading-overlay::after{content:"";position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(8,119,255,.25) 0%,transparent 60%);top:50%;left:50%;transform:translate(-50%,-50%);animation:loaderGlow .6s ease-in-out infinite alternate}
    @keyframes loaderBgSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
    @keyframes loaderGlow{0%{opacity:.3;transform:translate(-50%,-50%) scale(.9)}100%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
    .loading-overlay.show{display:flex!important;animation:overlayIn .3s ease-out}
    @keyframes overlayIn{from{opacity:0}to{opacity:1}}
    .loader-content{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;z-index:2;animation:contentIn .4s cubic-bezier(.2,.8,.2,1)}
    @keyframes contentIn{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}

    /* Rings */
    .loader-rings{position:relative;width:160px;height:160px}
    .loader-ring{position:absolute;border-radius:50%;border:3px solid transparent;top:50%;left:50%;transform:translate(-50%,-50%)}
    .loader-ring.r1{width:160px;height:160px;border-top-color:#0877ff;border-right-color:rgba(8,119,255,.5);animation:loaderSpin .6s linear infinite;filter:drop-shadow(0 0 10px rgba(8,119,255,.6))}
    .loader-ring.r2{width:120px;height:120px;border-bottom-color:#00d4ff;border-left-color:rgba(0,212,255,.4);animation:loaderSpin .4s linear infinite reverse;filter:drop-shadow(0 0 8px rgba(0,212,255,.5))}
    .loader-ring.r3{width:80px;height:80px;border-top-color:#7c3aed;border-right-color:rgba(124,58,237,.4);animation:loaderSpin .8s linear infinite;filter:drop-shadow(0 0 6px rgba(124,58,237,.5))}
    @keyframes loaderSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}

    /* Logo */
    .loader-logo-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,rgba(8,119,255,.3),rgba(124,58,237,.3));display:grid;place-items:center;animation:loaderPulse .7s ease-in-out infinite;z-index:3;box-shadow:0 0 40px rgba(8,119,255,.4)}
    .loader-logo-wrap::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(8,119,255,.3);animation:loaderPulseRing .5s ease-in-out infinite}
    .loader-logo-wrap::after{content:"";position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(8,119,255,.15);animation:loaderPulseRing .7s ease-in-out infinite .1s}
    .loader-logo{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 2px 10px rgba(8,119,255,.7))}
    @keyframes loaderPulse{0%,100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 40px rgba(8,119,255,.4)}50%{transform:translate(-50%,-50%) scale(1.1);box-shadow:0 0 80px rgba(8,119,255,.6),0 0 120px rgba(8,119,255,.2)}}
    @keyframes loaderPulseRing{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.9;transform:scale(1.2)}}

    /* Energy sweep */
    .loader-sweep{position:absolute;width:200px;height:200px;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden}
    .loader-sweep::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0%,rgba(0,212,255,.4) 10%,transparent 20%);animation:loaderSpin .5s linear infinite}

    /* Particles */
    .loader-particles{position:absolute;width:220px;height:220px;top:50%;left:50%;transform:translate(-50%,-50%)}
    .loader-particles span{position:absolute;width:5px;height:5px;border-radius:50%;animation:particleFloat 1s ease-in-out infinite}
    .loader-particles span:nth-child(1){top:5%;left:50%;background:#0877ff;animation-delay:0s}
    .loader-particles span:nth-child(2){top:25%;right:8%;background:#00d4ff;animation-delay:.12s}
    .loader-particles span:nth-child(3){bottom:25%;right:8%;background:#7c3aed;animation-delay:.25s}
    .loader-particles span:nth-child(4){bottom:5%;left:50%;background:#0877ff;animation-delay:.37s}
    .loader-particles span:nth-child(5){bottom:25%;left:8%;background:#00d4ff;animation-delay:.5s}
    .loader-particles span:nth-child(6){top:25%;left:8%;background:#7c3aed;animation-delay:.62s}
    @keyframes particleFloat{0%{opacity:0;transform:scale(0)}30%{opacity:1;transform:scale(1.4)}60%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(0)}}

    /* Text */
    .loader-text-group{text-align:center;position:relative;z-index:3}
    .loader-brand{font-size:22px;font-weight:1000;color:#fff;letter-spacing:.08em;line-height:1;text-shadow:0 0 30px rgba(8,119,255,.5)}
    .loader-brand em{font-style:italic;color:#0877ff;font-weight:900;text-shadow:0 0 25px rgba(8,119,255,.7)}
    .loader-status{font-size:13px;color:rgba(255,255,255,.6);margin-top:10px;font-weight:600;animation:statusFade .8s ease-in-out infinite}
    @keyframes statusFade{0%,100%{opacity:.3}50%{opacity:1}}

    /* Dots */
    .loader-dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
    .loader-dots span{width:7px;height:7px;border-radius:50%;background:#0877ff;animation:dotBounce .6s ease-in-out infinite}
    .loader-dots span:nth-child(1){animation-delay:0s}
    .loader-dots span:nth-child(2){animation-delay:.1s;background:#00d4ff}
    .loader-dots span:nth-child(3){animation-delay:.2s;background:#7c3aed}
    @keyframes dotBounce{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1.4);opacity:1}}

    /* Progress bar */
    .loader-progress{width:180px;height:3px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;position:relative;z-index:3}
    .loader-progress-bar{height:100%;width:0;background:linear-gradient(90deg,#0877ff,#00d4ff,#7c3aed,#0877ff);background-size:300% 100%;border-radius:999px;transition:width .2s ease;animation:progressShimmer .8s linear infinite;box-shadow:0 0 10px rgba(0,212,255,.5)}
    @keyframes progressShimmer{0%{background-position:0% 0}100%{background-position:300% 0}}

    /* ─── SKELETON LOADERS ─── */
    .skeleton{background:linear-gradient(90deg,var(--soft) 25%,rgba(8,119,255,.08) 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .skeleton-card{height:280px;border-radius:20px}
    .skeleton-text{height:14px;margin:8px 0;border-radius:6px}
    .skeleton-text.w60{width:60%}
    .skeleton-text.w40{width:40%}
    .skeleton-text.w80{width:80%}
    .skeleton-circle{width:80px;height:80px;border-radius:50%}
    .skeleton-btn{height:44px;border-radius:12px;margin-top:12px}

    /* ─── OFFLINE BANNER ─── */
    .offline-banner{display:none;position:fixed;top:0;left:0;right:0;background:#ef4444;color:#fff;text-align:center;padding:8px;font-size:12px;font-weight:700;z-index:200}
    .offline-banner.show{display:block}

    /* ─── PULL TO REFRESH ─── */
    .pull-indicator{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-60px);width:40px;height:40px;border-radius:50%;background:var(--panel);border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;z-index:35;transition:transform .3s ease;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    .pull-indicator.show{transform:translateX(-50%) translateY(16px)}
    .pull-indicator.refreshing{transform:translateX(-50%) translateY(16px)}
    .pull-indicator svg{width:20px;height:20px;stroke:var(--blue);transition:transform .3s}
    .pull-indicator.refreshing svg{animation:spin .8s linear infinite}
    .pull-text{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;color:var(--muted);z-index:35;opacity:0;transition:all .3s;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.1)}
    .pull-text.show{transform:translateX(-50%) translateY(0);opacity:1}

    /* ─── TABLE MOBILE CARDS ─── */
    @media(max-width:768px){
      .table-wrap{border:none;background:transparent}
      table{min-width:0}
      thead{display:none}
      tbody{display:grid;gap:10px}
      tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
      td{padding:4px 0;border:none;font-size:12px}
      td::before{content:attr(data-label);display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
      td:first-child{grid-column:1/-1}
      .op-product{flex-direction:row;gap:8px}
      .row-actions{grid-column:1/-1;justify-content:flex-end}
    }

    @keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
    @keyframes pulse{to{box-shadow:0 0 0 22px rgba(18,164,84,0)}}
    @keyframes pulseWarn{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes loginIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
    @keyframes heroIn{from{opacity:0;transform:translateX(-20px) scale(.98)}to{opacity:1;transform:none}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

    @media(max-width:1020px){
      .login{grid-template-columns:1fr;padding:0;gap:0;align-content:center;background:linear-gradient(180deg,#0a1628 0%,#0d1d31 40%,#111f3a 100%);min-height:100vh;min-height:100dvh}
      .login-visual{display:none}
      .mobile-hero{display:block}
      .login-panel{padding:0;max-width:100%;border-radius:0;background:var(--panel);border:none;box-shadow:0 -20px 60px rgba(0,0,0,.2);animation:loginIn .5s cubic-bezier(.2,.8,.2,1) both;position:relative;overflow:hidden}
      .login-panel::before{display:none}
      .login-panel::after{display:none}
      .login-panel>#loginForm,.login-panel>#registerForm{padding:28px 24px 32px}

      .brand-title{font-size:20px}
      .brand-title em{font-size:22px}

      .download-btn:active{transform:scale(.97);box-shadow:0 4px 16px rgba(0,0,0,.2)}
      .secure{margin-top:16px;font-size:11px}

      .mobile-hero .hero-logo{width:68px;height:68px}

      .product .price{font-size:22px}

    @supports(padding:env(safe-area-inset-bottom)){
      .side{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
      .main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}

    /* ─── DARK MODE: OVERRIDE COMPLETO ─── */
    body.dark .pill{background:rgba(13,29,49,.95);border:1px solid rgba(8,119,255,.35);color:#eef6ff;box-shadow:0 2px 12px rgba(0,0,0,.25)}

    body.dark .admin-action{background:rgba(18,37,59,.6);border-color:#1e3652}
    body.dark .status-chip{background:rgba(18,37,59,.6);border-color:#1e3652}
    body.dark .analytics-card{background:rgba(18,37,59,.5);border-color:#1e3652}
